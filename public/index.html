<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>sora コンテンツチェック</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#000;color:#fff;font-family:-apple-system,BlinkMacSystemFont,sans-serif;max-width:600px;margin:0 auto}
.tabs{display:flex;position:sticky;top:0;z-index:100;background:#000;border-bottom:1px solid #333}
.tab{flex:1;text-align:center;padding:14px 0;font-size:15px;font-weight:700;color:#888;cursor:pointer;border-bottom:2px solid transparent;transition:.2s}
.tab.active{color:#fff;border-bottom-color:#1d9bf0}
header{padding:16px;border-bottom:1px solid #333}
header h1{font-size:20px;font-weight:700}
.card{padding:16px;border-bottom:1px solid #222}
.card.ok{border-left:3px solid #00ba7c}
.card.ng{border-left:3px solid #f4212e}
.meta{display:flex;gap:8px;margin-bottom:8px;align-items:center}
</style>
<style>
.cat{background:#1d9bf0;color:#fff;font-size:12px;padding:2px 8px;border-radius:12px}
.theme{color:#aaa;font-size:13px}
.text{white-space:pre-wrap;line-height:1.7;font-size:15px;margin:10px 0}
.note-text{font-size:14px;line-height:1.8}
.actions{display:flex;gap:20px;justify-content:flex-end;padding-top:8px}
.actions button{background:none;border:1px solid #333;color:#fff;width:44px;height:44px;border-radius:50%;font-size:18px;cursor:pointer;transition:.2s}
.actions button:active{transform:scale(.9)}
.actions .ok-btn.on{background:#00ba7c;border-color:#00ba7c}
.actions .ng-btn.on{background:#f4212e;border-color:#f4212e}
.actions .edit-btn.on{background:#1d9bf0;border-color:#1d9bf0}
.toast{position:fixed;bottom:80px;left:50%;transform:translateX(-50%);background:#1d9bf0;color:#fff;padding:10px 24px;border-radius:20px;font-size:14px;opacity:0;transition:.3s;pointer-events:none;z-index:200}
.toast.show{opacity:1}
.saving{opacity:.5;pointer-events:none}
.edit-area{width:100%;background:#111;color:#fff;border:1px solid #333;border-radius:8px;padding:10px;font-size:14px;line-height:1.7;margin-top:8px;resize:vertical;font-family:inherit}
.edit-actions{display:flex;gap:8px;margin-top:8px;justify-content:flex-end}
.edit-actions button{padding:8px 16px;border-radius:16px;border:none;font-size:13px;cursor:pointer}
.save-btn{background:#1d9bf0;color:#fff}
.cancel-btn{background:#333;color:#fff}
.counter{text-align:center;padding:12px;color:#888;font-size:13px;border-bottom:1px solid #222}
</style>
</head>
<body>
<div class="tabs">
  <div class="tab active" data-type="threads">Threads</div>
  <div class="tab" data-type="note">note</div>
</div>
<header><h1 id="pageTitle">Threads チェック</h1></header>
<div class="counter" id="counter"></div>
<div id="app">読み込み中...</div>
<div class="toast" id="toast"></div>

<script>
let items = [];
let currentType = 'threads';
let editingId = null;
let refreshTimer = null;

const titles = { threads: 'Threads チェック', note: 'note チェック' };

document.querySelectorAll('.tab').forEach(tab => {
  tab.addEventListener('click', () => {
    const type = tab.dataset.type;
    if (type === currentType) return;
    currentType = type;
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    tab.classList.add('active');
    document.getElementById('pageTitle').textContent = titles[type];
    editingId = null;
    load();
  });
});

async function load() {
  try {
    const r = await fetch('/api/data?type=' + currentType);
    items = await r.json();
    render();
  } catch(e) { document.getElementById('app').textContent = 'エラー: ' + e.message; }
}

function render() {
  const app = document.getElementById('app');
  const ok = items.filter(i=>i.status==='ok').length;
  const ng = items.filter(i=>i.status==='ng').length;
  const draft = items.filter(i=>i.status==='draft').length;
  document.getElementById('counter').textContent = `OK ${ok} / ボツ ${ng} / 未確認 ${draft} / 全${items.length}件`;

  const isNote = currentType === 'note';
  app.innerHTML = items.map(item => {
    const cls = item.status === 'ok' ? 'ok' : item.status === 'ng' ? 'ng' : '';
    const editing = editingId === item.id;
    return `<div class="card ${cls}" id="card-${item.id}">
      <div class="meta">
        <span class="cat">${item.cat}</span>
        <span class="theme">${item.theme}</span>
      </div>
      ${editing
        ? `<textarea class="edit-area" id="edit-${item.id}" rows="${isNote ? 12 : 6}">${item.text}</textarea>
           <div class="edit-actions">
             <button class="cancel-btn" onclick="cancelEdit()">キャンセル</button>
             <button class="save-btn" onclick="saveEdit(${item.id})">保存</button>
           </div>`
        : `<div class="text ${isNote ? 'note-text' : ''}">${item.text}</div>`
      }
      <div class="actions">
        <button class="ok-btn ${item.status==='ok'?'on':''}" onclick="toggle(${item.id},'ok')">&#10084;</button>
        <button class="ng-btn ${item.status==='ng'?'on':''}" onclick="toggle(${item.id},'ng')">&#10005;</button>
        <button class="edit-btn ${editing?'on':''}" onclick="startEdit(${item.id})">&#9998;</button>
      </div>
    </div>`;
  }).join('');
}

async function toggle(id, newStatus) {
  const item = items.find(i=>i.id===id);
  if (!item) return;
  const status = item.status === newStatus ? 'draft' : newStatus;
  const card = document.getElementById('card-'+id);
  card.classList.add('saving');
  try {
    await fetch('/api/data?type=' + currentType, {
      method:'PATCH',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({id, status})
    });
    item.status = status;
    render();
    toast(status==='ok'?'OK!':status==='ng'?'ボツ':'戻しました');
  } catch(e) { toast('エラー'); }
  card.classList.remove('saving');
}

function startEdit(id) {
  editingId = editingId === id ? null : id;
  render();
}
function cancelEdit() { editingId = null; render(); }

async function saveEdit(id) {
  const ta = document.getElementById('edit-'+id);
  if (!ta) return;
  const text = ta.value;
  try {
    await fetch('/api/data?type=' + currentType, {
      method:'PATCH',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({id, text})
    });
    const item = items.find(i=>i.id===id);
    if (item) item.text = text;
    editingId = null;
    render();
    toast('保存しました');
  } catch(e) { toast('エラー'); }
}

function toast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'), 1500);
}

load();
refreshTimer = setInterval(load, 10000);
</script>
</body>
</html>
