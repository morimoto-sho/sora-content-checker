<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>sora Threads チェック</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{
  font-family:-apple-system,BlinkMacSystemFont,'Hiragino Sans',sans-serif;
  background:#000;color:#e7e9ea;max-width:600px;margin:0 auto;
  -webkit-font-smoothing:antialiased;
}
.header{
  position:sticky;top:0;z-index:100;
  background:rgba(0,0,0,.85);backdrop-filter:blur(12px);
  border-bottom:1px solid #2f3336;padding:14px 16px;
}
.header h1{font-size:18px;font-weight:800}
.header h1 span{color:#1d9bf0}
.prog{margin-top:8px;display:flex;align-items:center;gap:10px}
.prog-bar{flex:1;height:4px;background:#2f3336;border-radius:2px;overflow:hidden}
.prog-fill{height:100%;background:#00ba7c;border-radius:2px;transition:width .3s}
.prog-num{font-size:13px;color:#71767b;white-space:nowrap}
</style>
<style>
.filters{
  display:flex;border-bottom:1px solid #2f3336;
  position:sticky;top:58px;z-index:99;
  background:rgba(0,0,0,.85);backdrop-filter:blur(12px);
}
.fbtn{
  flex:1;padding:13px 0;text-align:center;font-size:14px;font-weight:600;
  color:#71767b;background:none;border:none;cursor:pointer;
  border-bottom:2px solid transparent;
}
.fbtn.on{color:#e7e9ea;border-bottom-color:#1d9bf0}

.feed{padding-bottom:60px}
.post{border-bottom:1px solid #2f3336;padding:16px}
.post-head{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.ava{
  width:40px;height:40px;border-radius:50%;
  background:linear-gradient(135deg,#667eea,#764ba2);
  display:flex;align-items:center;justify-content:center;
  font-size:14px;font-weight:700;color:#fff;flex-shrink:0;
}
.post-info{flex:1}
.post-name{font-size:15px;font-weight:700}
.post-cat{font-size:13px;color:#71767b}
.post-text{
  font-size:15px;line-height:1.75;white-space:pre-wrap;
  word-break:break-word;margin-left:50px;
}
/* Edit */
.post-edit{display:none;margin-left:50px;margin-top:8px}
.post.editing .post-text{display:none}
.post.editing .post-edit{display:block}
.post-ta{
  width:100%;min-height:120px;background:#16181c;border:1px solid #2f3336;
  border-radius:12px;padding:12px;color:#e7e9ea;font-size:15px;
  line-height:1.7;font-family:inherit;resize:vertical;
}
.edit-row{display:flex;gap:8px;justify-content:flex-end;margin-top:8px}
.edit-row button{padding:8px 20px;border-radius:20px;font-size:13px;font-weight:700;border:none;cursor:pointer}
.e-cancel{background:#2f3336;color:#e7e9ea}
.e-save{background:#1d9bf0;color:#fff}

/* Actions */
.actions{display:flex;margin-left:50px;margin-top:12px;gap:0}
.abtn{
  display:flex;align-items:center;gap:5px;
  background:none;border:none;cursor:pointer;
  color:#71767b;font-size:13px;padding:8px 16px;border-radius:50px;
}
.abtn svg{width:20px;height:20px}
.abtn.ok:hover,.abtn.ok.on{color:#00ba7c;background:rgba(0,186,124,.1)}
.abtn.ok.on svg{fill:#00ba7c}
.abtn.ng:hover,.abtn.ng.on{color:#f91880;background:rgba(249,24,128,.1)}
.abtn.ng.on svg{fill:#f91880}
.abtn.ed:hover{color:#1d9bf0;background:rgba(29,155,240,.1)}
.abtn.on{font-weight:700}
.empty{text-align:center;padding:80px 20px;color:#71767b;font-size:15px}
.toast{
  position:fixed;bottom:30px;left:50%;transform:translateX(-50%) translateY(80px);
  background:#1d9bf0;color:#fff;padding:10px 24px;border-radius:24px;
  font-size:14px;font-weight:600;opacity:0;transition:all .3s;z-index:300;
}
.toast.show{transform:translateX(-50%) translateY(0);opacity:1}
</style>
</head>
<body>
<div class="header">
  <h1><span>sora</span> Threads チェック</h1>
  <div class="prog">
    <div class="prog-bar"><div class="prog-fill" id="pf"></div></div>
    <div class="prog-num" id="pn"></div>
  </div>
</div>
<div class="filters" id="fil"></div>
<div class="feed" id="feed"></div>
<div class="toast" id="toast"></div>

<script>
const D=[{"id": 144, "cat": "奈良あるある", "theme": "奈良県民あるある", "text": "奈良あるある言いたい。\n\n「奈良って何もないよね」\n言われるたびに\n「いや、あるねん…」ってなる。\n\n・鹿せんべい買ったことない\n・大阪まで30分が最大のメリット\n・イオンモール大和郡山の安心感\n・でもなんだかんだ奈良が好き\n\n奈良民のみんな、あるある教えて。"}, {"id": 145, "cat": "奈良カフェ\n★クロスエンゲージ", "theme": "奈良の推しカフェ", "text": "新大宮の◯◯ってカフェ知ってる？\n\nここのスコーン、ほんまに美味しくて\n施術の合間にこっそり買いに行く。笑\n\nひとりでも入りやすいし\n窓際の席が最高。\n\n行ったことある人は〇って教えて！\nおすすめのカフェも知りたい~"}, {"id": 146, "cat": "奈良季節ネタ", "theme": "奈良の四季とヘア", "text": "奈良の梅雨、髪の毛の敵すぎん？\n\n朝セットしても\n家出て5分でアウトなんやけど。笑\n\n新大宮の駅着く頃には\nもうぺたんこ。\n\n同じ悩みの奈良女子、\nsoraは味方やで。\n\n湿気対策noteに書いたから見てー。"}, {"id": 147, "cat": "女性の本音", "theme": "髪の悩み、言えない", "text": "髪のボリュームが減ってきた気がする。\n\nこれ、20代後半から\nじわじわ感じる人多いと思う。\n\n人に言いにくいよね。\n美容室で相談するのも恥ずかしいし。\n\nでもsoraにはなんでも話して。\n女同士やし。\n\nこの悩みとの向き合い方\nnoteに本音で書いてます。"}, {"id": 148, "cat": "★エクステあるある\n【Threads版】", "theme": "エクステの本音あるある", "text": "エクステつけてる人にしかわからない\nあるある言いたい。\n\n・シャンプーが前より丁寧になった\n・風強い日ちょっと心配になる\n・「それエクステ？」って聞かれると嬉しい\n・朝の準備が爆速になった\n・鏡見る回数が確実に増えた\n\nわかる人いたら教えて。笑\n\nちなみにケアのコツ、noteに書いてるよ。"}, {"id": 149, "cat": "お客様こぼれ話", "theme": "IGの裏側ストーリー", "text": "さっきIGに上げたBefore/After。\nあの子、実は初エクステで。\n\n最初めっちゃ不安そうやったのに\n仕上がり見た瞬間\n鏡の前でずっと髪触ってくれて。\n\n「明日会社行くの楽しみ」って。\n\nこういう言葉が聞けるから\nsoraは新大宮でやってる。\n\n施術の詳細はnoteに書いてます。"}, {"id": 150, "cat": "soraの日常", "theme": "美容師の休日", "text": "休みの日、何してるか聞かれるけど\n正直に言うと\n\n奈良をうろうろしてる。笑\n\nならまちでランチして\n雑貨屋さん覗いて\nコーヒー買って帰る。\n\nザ・奈良の休日。\nこういう暮らしが好き。"}, {"id": 151, "cat": "想い・価値観", "theme": "soraが大事にしてること", "text": "「また来たい」って思ってもらえる\nサロンって何やろう。\n\n技術はもちろんやけど\nsoraは「話しやすかった」って\n言ってもらえるのが一番嬉しい。\n\n女性のお客様が多いから\n「こうなりたい」をちゃんと聴く。\nそこからがsoraの仕事。\n\nこの話、noteで深掘りしてます。"}];
const D2=[{"id": 152, "cat": "奈良イベント\n★CTA強化", "theme": "季節行事×ヘア提案", "text": "来週なら燈花会やん。\n\nキャンドルの中歩くの好きすぎて\n毎年行ってる。\n\n浴衣に合う髪にしたいなぁ。\nアップにしたいけどボリューム欲しい。\n\nイベント前にエクステ、\nけっこうおすすめです。\n\n行く予定の人、〇って教えて！"}, {"id": 153, "cat": "他者投稿リアクション\n★最速認知戦略", "theme": "共感リポスト", "text": "（引用リポスト テンプレ）\n\nパターンA：@nara_select投稿に対して\nここ行ったことある！\n新大宮から近くてお気に入り。\n奈良の穴場って最高よな。\n\nパターンB：@nara_lunch_cafe投稿に対して\nこのお店気になってた！\n休みの日に行ってみよ。\n奈良のカフェレベル高いわ。\n\nパターンC：奈良あるある系\n奈良民として共感しかない。笑\nこれ県外の人に説明しても伝わらんよね。"}, {"id": 154, "cat": "★奈良JKあるある\n【NEW】", "theme": "奈良のJKあるある", "text": "奈良のJKあるある、言いたい。\n\n・校則で髪染められへんから\n卒業したら絶対染めるリスト作ってる\n・待ち合わせは行基さん前\n・放課後はとりあえずミ・ナーラ\n・プリクラ→ラウンドワン→フードコートの\n黄金コース\n・遊ぶのは大阪やけど\n帰ってきたら「やっぱ奈良やな」ってなる\n\nわかる人、おる？笑\n\nsoraも奈良大好きやから\nこの気持ちめっちゃわかるねん。\n\n卒業したら髪の相談乗るから\nいつでもDMしてな。"}, {"id": 155, "cat": "★大学デビューの話\n【NEW】", "theme": "soraが垢抜けのお手伝い", "text": "「大学入ったら絶対垢抜ける」\nって決めてた子が来てくれた話。\n\n高校3年間、校則守って\nずっと黒髪ストレートやったらしい。\n\n「入学式までに変わりたいんです」\nって、目がめっちゃ真剣で。\n\nsoraと一緒に「なりたい自分」を\n2時間かけて作った。\n\n仕上がり見た瞬間\n「これが私…？」って泣いてて\nsoraも泣きそうやった。\n\n大学デビューで変わりたい子、\nsoraが全力で応援するから。\n気軽にDMしてね。"}, {"id": 156, "cat": "★〇〇な人だけいいねして\n【バズ設計書連動】", "theme": "行動喚起型エンゲージ", "text": "エクステ気になってるけど\n踏み出せない人だけいいねして。\n\nsoraのお客様、最初はみんなそうだった。\n踏み出した人は全員\n「もっと早くやればよかった」って言う。\n\nDMで相談だけでも大丈夫やで。"}, {"id": 157, "cat": "★美容師の本音\n【バズ設計書連動】", "theme": "美容師が正直に言いたいこと", "text": "美容師が正直に言いたいこと。\n\n・「何でもいいです」が一番困る\n・参考画像あると本気出せる\n・実は「似合う」と「やりたい」のバランスが大事\n・エクステつけるかは最初から決めなくていい\n\nsoraは全部聴くから、なんでも話してね。"}, {"id": 158, "cat": "★奈良ポエム\n【バズ設計書連動】", "theme": "奈良で暮らしてて思うこと", "text": "奈良って、急がない街やなって思う。\n\n大阪みたいにせかせかしてないし\n京都みたいに気取ってない。\n\nのんびり鹿が歩いてて\nみんなちょっと優しい。\n\nsoraが奈良でサロンやってる理由、\nたぶんこれ。"}, {"id": 159, "cat": "★美容室選び教育\n【バズ設計書連動】", "theme": "エクステで失敗しない美容室の選び方", "text": "エクステで失敗しない美容室の選び方。\n\n・カウンセリングが5分以下→危険\n・「何本でも同じ」って言う→危険\n・Before/Afterを見せてくれない→危険\n・地毛との馴染み方を説明しない→危険\n\nsoraは最低30分カウンセリングする。\nそこが一番大事やと思ってるから。"}];
D.push(...D2);
const SK='sora-th-v3';
let S=load();
let F='all';

function load(){
  try{const s=localStorage.getItem(SK);if(s){const p=JSON.parse(s);if(p.length===D.length)return p}}catch(e){}
  return D.map(d=>({...d,status:'draft',memo:''}));
}
function save(){localStorage.setItem(SK,JSON.stringify(S))}
function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),1500)}
function esc(s){return s?String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'):''}

function stats(){
  const c={all:S.length,draft:0,approved:0,revision:0};
  S.forEach(s=>{c[s.status]=(c[s.status]||0)+1});return c;
}

function render(){
  const c=stats();
  const pct=c.all?Math.round(c.approved/c.all*100):0;
  document.getElementById('pf').style.width=pct+'%';
  document.getElementById('pn').textContent=c.approved+'/'+c.all+' OK ('+pct+'%)';

  document.getElementById('fil').innerHTML=[
    {k:'all',l:'すべて',n:c.all},{k:'draft',l:'未チェック',n:c.draft},
    {k:'approved',l:'OK',n:c.approved},{k:'revision',l:'ボツ',n:c.revision}
  ].map(x=>'<button class="fbtn'+(F===x.k?' on':'')+'" onclick="F=\''+x.k+'\';render()">'+x.l+' '+x.n+'</button>').join('');

  let items=F==='all'?S:S.filter(s=>s.status===F);
  const feed=document.getElementById('feed');
  if(!items.length){feed.innerHTML='<div class="empty">なし</div>';return}
  feed.innerHTML=items.map(p=>{
    const ok=p.status==='approved',ng=p.status==='revision';
    return '<div class="post" id="p'+p.id+'">'+
      '<div class="post-head"><div class="ava">S</div><div class="post-info">'+
      '<div class="post-name">'+esc(p.theme)+'</div>'+
      '<div class="post-cat">'+esc(p.cat)+'</div></div></div>'+
      '<div class="post-text">'+esc(p.text)+'</div>'+
      '<div class="post-edit"><textarea class="post-ta" id="ta'+p.id+'">'+esc(p.text)+'</textarea>'+
      '<div class="edit-row"><button class="e-cancel" onclick="document.getElementById(\'p'+p.id+'\').classList.remove(\'editing\')">やめる</button>'+
      '<button class="e-save" onclick="doSave('+p.id+')">保存</button></div></div>'+
      '<div class="actions">'+
      '<button class="abtn ed" onclick="document.getElementById(\'p'+p.id+'\').classList.add(\'editing\')" title="編集"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M3 17.25V21h3.75L17.81 9.94l-3.75-3.75L3 17.25zM20.71 7.04a1 1 0 000-1.41l-2.34-2.34a1 1 0 00-1.41 0l-1.83 1.83 3.75 3.75 1.83-1.83z"/></svg></button>'+
      '<button class="abtn ng'+(ng?' on':'')+'" onclick="tog('+p.id+',\'revision\')" title="ボツ"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm5 13.59L15.59 17 12 13.41 8.41 17 7 15.59 10.59 12 7 8.41 8.41 7 12 10.59 15.59 7 17 8.41 13.41 12 17 15.59z"/></svg>'+(ng?' ボツ':'')+'</button>'+
      '<button class="abtn ok'+(ok?' on':'')+'" onclick="tog('+p.id+',\'approved\')" title="投稿OK"><svg viewBox="0 0 24 24" fill="currentColor"><path d="'+(ok?'M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z':'M16.5 3c-1.74 0-3.41.81-4.5 2.09C10.91 3.81 9.24 3 7.5 3 4.42 3 2 5.42 2 8.5c0 3.78 3.4 6.86 8.55 11.54L12 21.35l1.45-1.32C18.6 15.36 22 12.28 22 8.5 22 5.42 19.58 3 16.5 3zm-4.4 15.55l-.1.1-.1-.1C7.14 14.24 4 11.39 4 8.5 4 6.5 5.5 5 7.5 5c1.54 0 3.04.99 3.57 2.36h1.87C13.46 5.99 14.96 5 16.5 5c2 0 3.5 1.5 3.5 3.5 0 2.89-3.14 5.74-7.9 10.05z')+'"/></svg>'+(ok?' OK':'')+'</button>'+
      '</div></div>';
  }).join('');
}
function tog(id,t){
  const p=S.find(s=>s.id===id);if(!p)return;
  p.status=p.status===t?'draft':t;save();
  toast(p.status==='approved'?'💚 投稿OK':p.status==='revision'?'🚫 ボツ':'戻しました');
  render();
}
function doSave(id){
  const p=S.find(s=>s.id===id);if(!p)return;
  p.text=document.getElementById('ta'+id).value;save();
  document.getElementById('p'+id).classList.remove('editing');
  toast('保存しました');render();
}

render();
</script>
</body>
</html>
