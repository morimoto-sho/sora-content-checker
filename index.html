<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>sora コンテンツチェッカー</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#000;--card:#16181c;--border:#2f3336;
  --text:#e7e9ea;--sub:#71767b;--blue:#1d9bf0;
  --green:#00ba7c;--pink:#f91880;--red:#f4212e;
  --like-bg:rgba(0,186,124,0.1);--nope-bg:rgba(249,24,128,0.1);
}
body{
  font-family:-apple-system,BlinkMacSystemFont,'Hiragino Sans',sans-serif;
  background:var(--bg);color:var(--text);
  -webkit-font-smoothing:antialiased;
  max-width:600px;margin:0 auto;
  padding-bottom:env(safe-area-inset-bottom);
}
/* Header */
.header{
  position:sticky;top:0;z-index:100;
  background:rgba(0,0,0,0.85);backdrop-filter:blur(12px);
  border-bottom:1px solid var(--border);
  padding:12px 16px;
}
.header-top{display:flex;align-items:center;justify-content:space-between}
.header h1{font-size:20px;font-weight:800}
.header h1 span{color:var(--blue)}
.progress{margin-top:10px}
.progress-bar{height:4px;background:var(--border);border-radius:2px;overflow:hidden}
.progress-fill{height:100%;background:var(--green);border-radius:2px;transition:width .3s}
.progress-text{font-size:12px;color:var(--sub);margin-top:4px;text-align:right}

/* Filter tabs */
.filters{
  display:flex;gap:0;border-bottom:1px solid var(--border);
  background:rgba(0,0,0,0.85);backdrop-filter:blur(12px);
  position:sticky;top:62px;z-index:99;
}
.filter-btn{
  flex:1;padding:14px 8px;text-align:center;
  font-size:13px;font-weight:600;color:var(--sub);
  background:none;border:none;cursor:pointer;
  border-bottom:2px solid transparent;
  transition:all .2s;
}
.filter-btn.active{color:var(--text);border-bottom-color:var(--blue)}
.filter-btn .count{
  display:inline-block;min-width:18px;
  padding:1px 6px;border-radius:10px;
  font-size:11px;margin-left:4px;
  background:var(--border);color:var(--sub);
}
.filter-btn.active .count{background:var(--blue);color:#fff}

/* Feed */
.feed{min-height:100vh}
.card{
  border-bottom:1px solid var(--border);
  padding:16px;transition:background .15s;
}
.card:active{background:rgba(255,255,255,0.03)}
.card-meta{
  display:flex;align-items:center;gap:8px;margin-bottom:8px;
}
.avatar{
  width:36px;height:36px;border-radius:50%;
  background:linear-gradient(135deg,#667eea,#764ba2);
  display:flex;align-items:center;justify-content:center;
  font-size:16px;font-weight:700;color:#fff;flex-shrink:0;
}
.meta-text{flex:1;min-width:0}
.meta-name{font-size:14px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.meta-cat{font-size:13px;color:var(--sub)}
.card-body{padding-left:44px}
.card-text{font-size:15px;line-height:1.7;white-space:pre-wrap;word-break:break-word}
.card-text .label{color:var(--blue);font-weight:600;font-size:13px;display:block;margin-top:10px;margin-bottom:2px}
.card-text .label:first-child{margin-top:0}

/* Memo */
.card-memo{
  margin-top:10px;padding-left:44px;
}
.memo-toggle{
  font-size:13px;color:var(--blue);background:none;border:none;
  cursor:pointer;padding:4px 0;
}
.memo-box{
  display:none;margin-top:6px;
}
.memo-box.open{display:block}
.memo-input{
  width:100%;background:var(--card);border:1px solid var(--border);
  border-radius:12px;padding:10px 12px;color:var(--text);
  font-size:13px;font-family:inherit;resize:vertical;min-height:60px;
}
.memo-input::placeholder{color:var(--sub)}

/* Actions */
.card-actions{
  display:flex;justify-content:space-around;
  padding:10px 0 0;margin-top:10px;padding-left:44px;
  max-width:300px;
}
.action-btn{
  display:flex;align-items:center;gap:6px;
  background:none;border:none;cursor:pointer;
  font-size:13px;color:var(--sub);
  padding:8px 12px;border-radius:50px;
  transition:all .15s;
}
.action-btn svg{width:18px;height:18px;fill:currentColor}
.action-btn.like:hover,.action-btn.like.active{color:var(--green);background:var(--like-bg)}
.action-btn.nope:hover,.action-btn.nope.active{color:var(--pink);background:var(--nope-bg)}
.action-btn.active{font-weight:700}

/* Status indicator */
.status-dot{
  width:8px;height:8px;border-radius:50%;flex-shrink:0;
}
.status-dot.draft{background:var(--sub)}
.status-dot.approved{background:var(--green)}
.status-dot.revision{background:var(--pink)}

/* Edit mode */
.edit-area{display:none;padding-left:44px;margin-top:8px}
.card.editing .edit-area{display:block}
.card.editing .card-text{display:none}
.edit-ta{
  width:100%;background:var(--card);border:1px solid var(--border);
  border-radius:12px;padding:10px 12px;color:var(--text);
  font-size:14px;line-height:1.6;font-family:inherit;resize:vertical;
  min-height:100px;margin-bottom:8px;
}
.edit-btns{display:flex;gap:8px;justify-content:flex-end}
.edit-btns button{
  padding:8px 20px;border-radius:20px;font-size:13px;font-weight:700;
  border:none;cursor:pointer;
}
.btn-cancel{background:var(--border);color:var(--text)}
.btn-save{background:var(--blue);color:#fff}

/* Empty */
.empty{text-align:center;padding:80px 20px;color:var(--sub)}
.empty-icon{font-size:48px;margin-bottom:12px}

/* Toast */
.toast{
  position:fixed;bottom:30px;left:50%;
  transform:translateX(-50%) translateY(80px);
  background:var(--blue);color:#fff;
  padding:10px 24px;border-radius:24px;
  font-size:14px;font-weight:600;
  opacity:0;transition:all .3s;z-index:300;
  pointer-events:none;
}
.toast.show{transform:translateX(-50%) translateY(0);opacity:1}
</style>
</head>
<body>
<div class="header">
  <div class="header-top">
    <h1><span>sora</span> チェッカー</h1>
  </div>
  <div class="progress">
    <div class="progress-bar"><div class="progress-fill" id="progFill"></div></div>
    <div class="progress-text" id="progText"></div>
  </div>
</div>
<div class="filters" id="filters"></div>
<div class="feed" id="feed"></div>
<div class="toast" id="toast"></div>

<script>
const SEED={"sheets": [{"id": 1, "name": "導線設計マップ", "sort_order": 0}, {"id": 2, "name": "共感フレーム集", "sort_order": 1}, {"id": 3, "name": "JK・JD共感コンテンツ集", "sort_order": 2}, {"id": 4, "name": "バズるコンテンツ設計書", "sort_order": 3}, {"id": 5, "name": "UGC・巻き込み施策", "sort_order": 4}, {"id": 6, "name": "奈良ローカルネタ帳", "sort_order": 5}, {"id": 7, "name": "IGフィード", "sort_order": 6}, {"id": 8, "name": "IGリール", "sort_order": 7}, {"id": 9, "name": "IGストーリーズ", "sort_order": 8}, {"id": 10, "name": "Threads", "sort_order": 9}, {"id": 11, "name": "note記事", "sort_order": 10}, {"id": 12, "name": "ハッシュタグ集", "sort_order": 11}, {"id": 13, "name": "週間投稿リズム", "sort_order": 12}], "contents": [{"id": 1, "sheet_id": 1, "row_number": 4, "col_data": "{\"STEP\":\"1. 認知\",\"プラットフォーム\":\"Instagram リール\",\"役割\":\"目を止める\\n「何この仕上がり！」\",\"コンテンツ例\":\"悩み共感フック→BA15秒\\n髪あるある→解決リール\\n朝セット時短リール\\n★「エクステあるある」シリーズ\\n（ブルーオーシャン！）\",\"KPI\":\"リーチ数\\n保存数\",\"次STEPへの誘導\":\"キャプションで\\n「詳しくはnoteで→」\"}", "status": "draft", "memo": ""}, {"id": 2, "sheet_id": 1, "row_number": 5, "col_data": "{\"STEP\":\"2. 興味\",\"プラットフォーム\":\"Instagram フィード\",\"役割\":\"世界観+信頼を伝える\\nsoraの美学を刷り込む\",\"コンテンツ例\":\"施術事例カルーセル\\nお客様の声リポスト\\nsoraのこだわりポスト\\n★@ivan_liz_との差別化：\\n質の高いBA＋ストーリー性\",\"KPI\":\"いいね数\\nプロフ遷移率\",\"次STEPへの誘導\":\"プロフリンクに\\nnote URL設置\"}", "status": "draft", "memo": ""}, {"id": 3, "sheet_id": 1, "row_number": 6, "col_data": "{\"STEP\":\"3. 共感\",\"プラットフォーム\":\"Threads\",\"役割\":\"人柄で距離を縮める\\n奈良の暮らしで繋がる\",\"コンテンツ例\":\"奈良あるある\\n女性の本音トーク\\n★@nara_select式CTA活用\\n（「行きたいと思ったら\\n〇とコメント」）\\nお客様の声リポスト\",\"KPI\":\"フォロワー増加率\\nリプライ数\",\"次STEPへの誘導\":\"「この話noteに\\n詳しく書いたよ」\"}", "status": "draft", "memo": ""}, {"id": 4, "sheet_id": 1, "row_number": 7, "col_data": "{\"STEP\":\"4. 信頼\",\"プラットフォーム\":\"note\",\"役割\":\"深く知ってもらう\\n「この人に任せたい」\",\"コンテンツ例\":\"施術こだわり記事\\nお客様の変身ストーリー\\nsoraの美容ストーリー\",\"KPI\":\"PV・スキ数\\n読了率\",\"次STEPへの誘導\":\"記事末に予約リンク\\nIG DMへの導線\"}", "status": "draft", "memo": ""}, {"id": 5, "sheet_id": 1, "row_number": 8, "col_data": "{\"STEP\":\"5. 行動\",\"プラットフォーム\":\"予約（HP/DM）\",\"役割\":\"施術予約に繋げる\\nUGCサイクルを回す\",\"コンテンツ例\":\"ストーリーズ限定クーポン\\n施術後の写真撮影→投稿許可\\nお客様タグ付け→リポスト\\n★#soraのエクステ で\\nUGC循環を作る\",\"KPI\":\"予約数\\nUGC投稿数\",\"次STEPへの誘導\":\"施術後に投稿お願い\\n→リポスト→新規認知\"}", "status": "draft", "memo": ""}, {"id": 6, "sheet_id": 1, "row_number": 10, "col_data": "{\"STEP\":\"ターゲットペルソナ\"}", "status": "draft", "memo": ""}, {"id": 7, "sheet_id": 1, "row_number": 11, "col_data": "{\"STEP\":\"奈良在住or通勤の25~35歳女性。32%が抜け毛・ボリューム減を感じ始める年代（※EPARKビューティー調査）。\\n「量が少ない」「巻いても決まらない」「ぺたんこ」を人に言えずにいる。エクステに興味はあるが「派手になりそう」「初めてで不安」。\\nInstagramで美容情報を集め、信頼できる人にお願いしたい。奈良の暮らしを楽しんでいて、カフェやスポットの情報にも敏感。\"}", "status": "draft", "memo": ""}, {"id": 8, "sheet_id": 1, "row_number": 13, "col_data": "{\"STEP\":\"共感設計の3原則\"}", "status": "draft", "memo": ""}, {"id": 9, "sheet_id": 1, "row_number": 14, "col_data": "{\"STEP\":\"1. 悩みの正当化から入る ── 「20代で毛量減るの、実は珍しくない」のように、悩みが\\\"普通のこと\\\"だと安心させる\\n2. 他者の声を借りる ── お客様リポスト・引用で「私だけじゃない」を実感させる。sora発信より第三者の声のほうが信頼度40%UP\\n3. 営業感ゼロ ── noteへの誘導は「書いたよ~」の軽さで。Threadsは「奈良に住んでる美容師の女の子の日常」として見てもらう\"}", "status": "draft", "memo": ""}, {"id": 10, "sheet_id": 1, "row_number": 16, "col_data": "{\"STEP\":\"奈良エクステ市場 競合分析（実地リサーチ 2026年4月）\"}", "status": "draft", "memo": ""}, {"id": 11, "sheet_id": 1, "row_number": 17, "col_data": "{\"STEP\":\"アカウント\",\"プラットフォーム\":\"フォロワー数\",\"役割\":\"投稿数\",\"コンテンツ例\":\"特徴\",\"KPI\":\"soraとの差別化ポイント\",\"次STEPへの誘導\":\"学べること\"}", "status": "draft", "memo": ""}, {"id": 12, "sheet_id": 1, "row_number": 18, "col_data": "{\"STEP\":\"@vent_cloud.sora\\n（自分）\",\"プラットフォーム\":\"45\",\"役割\":\"0\",\"コンテンツ例\":\"ゼロスタート\\n白紙の状態\",\"KPI\":\"──\",\"次STEPへの誘導\":\"先行者のいない市場で\\n「エクステあるある」を\\n先に取りに行く\"}", "status": "draft", "memo": ""}, {"id": 13, "sheet_id": 1, "row_number": 19, "col_data": "{\"STEP\":\"@ivan_liz_\\n（奈良最大の競合）\",\"プラットフォーム\":\"1,317\",\"役割\":\"1,401\",\"コンテンツ例\":\"投稿量は多いが\\n共感・ストーリー性が薄い\\n施術写真が中心で\\nキャプションが短い\",\"KPI\":\"量より質で勝負\\n共感フック＋ストーリー性\\nnote誘導で深い信頼構築\\n→同じ土俵で戦わない\",\"次STEPへの誘導\":\"BAの撮影アングルは参考に\\n「奈良エクステ」タグでの\\n検索上位のヒント\"}", "status": "draft", "memo": ""}, {"id": 14, "sheet_id": 1, "row_number": 20, "col_data": "{\"STEP\":\"@mrrk__oro\\n（奈良）\",\"プラットフォーム\":\"1,976\",\"役割\":\"37\",\"コンテンツ例\":\"投稿数37と少ないが\\nフォロワーは多い\\n写真のクオリティ高め\",\"KPI\":\"投稿の質と一貫性で差をつける\\nThreads連携は未開拓\\n→先に取れる\",\"次STEPへの誘導\":\"少ない投稿でもフォロワーを\\n獲得できる事例\\n写真クオリティの重要性\"}", "status": "draft", "memo": ""}, {"id": 15, "sheet_id": 1, "row_number": 21, "col_data": "{\"STEP\":\"@nara_select\\n（奈良メディア）\",\"プラットフォーム\":\"110,000\\nThreads: 12,211\",\"役割\":\"3,400+\",\"コンテンツ例\":\"CTA設計が秀逸\\n「行きたいと思ったら\\n〇とコメントしてね！」\\n動画+店舗情報の構成\",\"KPI\":\"直接の競合ではなく活用先\\nこのアカウントに取り上げて\\nもらえるコンテンツ作り\\n引用リポストで認知拡大\",\"次STEPへの誘導\":\"CTA設計を参考にする\\nリール投稿のフォーマット\\n奈良ユーザーの反応パターン\"}", "status": "draft", "memo": ""}, {"id": 16, "sheet_id": 1, "row_number": 22, "col_data": "{\"STEP\":\"@nara_lunch_cafe\\n（奈良カフェ）\",\"プラットフォーム\":\"43,000\\nThreads: 6,848\",\"役割\":\"2,000+\",\"コンテンツ例\":\"UGCハッシュタグ戦略\\n#奈良ランチカフェ で\\n投稿を集めている\\nコミュニティ型運用\",\"KPI\":\"直接の競合ではなく活用先\\n奈良カフェ投稿への引用で\\n自然にsoraの認知を広げる\",\"次STEPへの誘導\":\"ハッシュタグでUGCを\\n集める仕組みを応用\\n→#soraのエクステ\"}", "status": "draft", "memo": ""}, {"id": 17, "sheet_id": 1, "row_number": 24, "col_data": "{\"STEP\":\"戦略サマリー：ブルーオーシャンを攻める\"}", "status": "draft", "memo": ""}, {"id": 18, "sheet_id": 1, "row_number": 25, "col_data": "{\"STEP\":\"【発見】奈良のエクステ市場はブルーオーシャン。最大の競合@ivan_liz_でも1,317フォロワー。共感型コンテンツを出しているアカウントは皆無。\\n【発見】「エクステあるある」コンテンツはIG/Threads/noteのすべてで未開拓。先に取れば第一人者になれる。\\n【発見】Threadsでのエクステ発信はほぼ存在しない。美容師アカウント(@takuma_aka_zynx等)もThreadsは告知中心で共感型は皆無。\\n\\n【戦略】@ivan_liz_とは「量」で張り合わず「質×共感×導線」で差別化。1投稿あたりの情報量・ストーリー性・note誘導で圧倒する。\\n【戦略】@nara_select(110K)・@nara_lunch_cafe(43K)のフォロワー層を引用リポスト・相互リプで取り込む。これが最速の認知拡大ルート。\\n【戦略】Threadsでの「奈良の美容師の日常」ポジションを先に確立。エクステ×奈良×共感の掛け合わせは他に誰もいない。\"}", "status": "draft", "memo": ""}, {"id": 19, "sheet_id": 2, "row_number": 2, "col_data": "{\"No.\":\"1\",\"フレーム名\":\"悩み正当化フレーム\",\"構造\":\"① 悩みを具体的に描写\\n② 「実はそれ、普通のこと」と安心させる\\n③ 解決策をチラ見せ\\n④ 詳細はnoteへ\",\"IG用テンプレ例\":\"【 20代で髪が減るのは珍しくない 】\\n\\n朝、枕についた髪の毛を見て\\nため息ついたこと、ありませんか？\\n\\n実は20代女性の32%が\\n抜け毛やボリューム減を感じてる。\\n\\nsoraのお客様にも同じ悩みの方、\\nたくさんいます。\\n\\n安心してほしいから、noteに\\n向き合い方を書きました。\",\"Threads用テンプレ例\":\"「最近、髪のボリューム減ってきた気がする」\\n\\nって思ってる人、けっこう多い。\\n20代女性の3人に1人が感じてるらしい。\\n\\nsoraのお客様もそういう方多くて。\\n人に言いにくいよね、わかる。\\n\\nこの話、noteに詳しく書いたよ。\",\"使えるシーン\":\"フィード：こだわりポスト\\nリール：悩みあるある系\\nThreads：美容本音トーク\",\"参考（伸びてるアカウントの傾向）\":\"EPARKビューティー調査データ活用\\n数字を入れると説得力UP\\n美容師アカウントの悩み共感系は\\n保存率が通常の2-3倍\"}", "status": "draft", "memo": ""}, {"id": 20, "sheet_id": 2, "row_number": 3, "col_data": "{\"No.\":\"2\",\"フレーム名\":\"Before→Insight→Afterフレーム\",\"構造\":\"① Before（お客様の悩み描写）\\n② Insight（原因や気づき）\\n③ After（変化と感情）\\n④ 第三者の声で補強\",\"IG用テンプレ例\":\"【 巻いても巻いてもぺたんこだった髪が 】\\n\\n「夕方には巻きが全部取れてて\\n毎日テンション下がる」\\n\\nそんなお悩みのお客様。\\n原因は毛量じゃなくて、髪の重さでした。\\n\\nエクステで軽さとボリュームをプラスしたら\\n「夜まで巻きが持つようになった！」って。\\n\\nその笑顔がsoraの原動力です。\\n施術の詳細はnoteで。\",\"Threads用テンプレ例\":\"さっきIGに上げた子、\\n実は「もう何やっても無理」って\\n最初の来店で言ってて。\\n\\n巻いても持たない、ぺたんこになる。\\n毎朝30分かけてセットしてたらしい。\\n\\nでもエクステつけたら\\n朝3分で決まるようになって\\n「人生変わった」って泣いてた。\\n\\nこういう瞬間があるから\\nこの仕事やめられん。\",\"使えるシーン\":\"フィード：BA事例\\nリール：劇的変身\\nThreads：こぼれ話\",\"参考（伸びてるアカウントの傾向）\":\"BA投稿は保存率が最も高い形式\\n「悩み→原因→解決」のストーリーアークが\\nInstagramで最も共感を呼ぶ構造\"}", "status": "draft", "memo": ""}, {"id": 21, "sheet_id": 2, "row_number": 4, "col_data": "{\"No.\":\"3\",\"フレーム名\":\"お客様の声リポストフレーム\",\"構造\":\"① お客様の投稿/DMを引用\\n② soraの感想・想いを添える\\n③ 「こういう声が一番嬉しい」\\n④ 同じ悩みの人への呼びかけ\",\"IG用テンプレ例\":\"【 お客様からのDM、泣きそうになった 】\\n\\n「友達に'髪キレイになったね'って\\n言われました。soraさんのおかげです」\\n\\n※お客様の許可を得て掲載しています\\n\\n技術を褒められるより\\n「日常が変わった」って言葉が一番嬉しい。\\n\\n同じ悩みを抱えてる方へ。\\nsoraがお手伝いできることがあります。\",\"Threads用テンプレ例\":\"お客様から嬉しいDMが来た。\\n\\n「エクステつけてから\\n毎朝のセットが楽しくなりました」\\n\\nこういう声もらうと\\nほんまにこの仕事やっててよかったって思う。\\n\\n悩んでる人がいたら\\n気軽にDMしてね。\",\"使えるシーン\":\"フィード：お客様の声\\nストーリーズ：DM紹介\\nThreads：日常の感動\",\"参考（伸びてるアカウントの傾向）\":\"第三者の声は広告より信頼度40%UP\\nリポスト前にDMでお礼を送ること\\n投稿許可は必ず書面or DMで取得\"}", "status": "draft", "memo": ""}, {"id": 22, "sheet_id": 2, "row_number": 5, "col_data": "{\"No.\":\"4\",\"フレーム名\":\"あるあるフレーム\\n★ブルーオーシャン\",\"構造\":\"① 「◯◯な人いる？」で呼びかけ\\n② あるあるを3-5個列挙\\n③ 「soraもそうだった」で同じ目線に\\n④ 解決策は押しつけず添える\\n\\n※「エクステあるある」は\\nIG/Threads共に未開拓！\\n先に取れば第一人者に\",\"IG用テンプレ例\":\"【 エクステつけたい人あるある 】\\n\\n- IG見て気になるけど一歩踏み出せない\\n- 「派手になったらどうしよう」が不安\\n- お店選びが難しすぎる\\n- 友達に相談しても「え、エクステ？」って言われる\\n- そもそも何本つけたらいいかわからない\\n\\nsoraのお客様も最初はみんなそうでした。\\n不安な気持ち、全部わかります。\\n\\n初めての方向けにnoteに書きました。\\n「不安」が「楽しみ」に変わるはず。\",\"Threads用テンプレ例\":\"エクステ気になるけど\\nまだ踏み出せてない人あるある。\\n\\n・IGで「エクステ」検索しまくってる\\n・でも「派手になりそう」が怖い\\n・周りにエクステの人いなくて聞けない\\n・美容室に行くこと自体が緊張する\\n\\nめっちゃわかる。笑\\nsoraのお客様、初めての人が半分以上やで。\\n\\n気になることあったらDMで聞いてね。\\n女同士やし、なんでも話そ。\",\"使えるシーン\":\"フィード：知識系\\nリール：あるある系\\nThreads：共感トーク\\n\\n★シリーズ化推奨\\n（vol.1, vol.2...）\",\"参考（伸びてるアカウントの傾向）\":\"「あるある」系は\\nコメント・リプライ率が高い\\n参加型コンテンツとして機能\\n\\n★リサーチ結果：\\nエクステあるあるを\\n出しているアカウントは\\nIG/Threads共にほぼゼロ\"}", "status": "draft", "memo": ""}, {"id": 23, "sheet_id": 2, "row_number": 6, "col_data": "{\"No.\":\"5\",\"フレーム名\":\"奈良ローカル×美容フレーム\",\"構造\":\"① 奈良の季節/天気/場所ネタ\\n② 自然に美容の話に繋げる\\n③ 「奈良で暮らす女性」の共感\\n④ ゆるく誘導\",\"IG用テンプレ例\":\"【 奈良の湿気、髪の敵すぎん？ 】\\n\\n梅雨の奈良、ほんまにやばい。\\n\\nせっかくセットしても\\n新大宮の駅着く頃にはぺたんこ。\\n\\n奈良で暮らす女性なら\\nこの悩みわかってくれるはず。\\n\\n湿気に負けないスタイル作り、\\nnoteにまとめました。\",\"Threads用テンプレ例\":\"奈良の梅雨、髪の毛の敵すぎん？\\n\\n朝セットしても\\n家出て5分でアウトなんやけど。笑\\n\\n奈良の湿気と戦ってる女性、\\nsoraは味方やで。\\n\\n湿気対策noteに書いたから見てー。\",\"使えるシーン\":\"フィード：季節系\\nリール：奈良ロケ系\\nThreads：奈良あるある\",\"参考（伸びてるアカウントの傾向）\":\"@nara_select（110K）のCTA手法\\n「行きたいと思ったら\\n〇とコメントしてね！」を応用\\n@nara_lunch_cafe（43K）\\nの引用で奈良クラスタ取込み\"}", "status": "draft", "memo": ""}, {"id": 24, "sheet_id": 2, "row_number": 7, "col_data": "{\"No.\":\"6\",\"フレーム名\":\"問いかけ参加型フレーム\",\"構造\":\"① 質問で始める\\n② soraの答えを先に出す\\n③ 「みんなはどう？」で参加促す\\n④ リプしやすい空気を作る\",\"IG用テンプレ例\":\"【 みんなに聞きたい 】\\n\\n美容室選ぶとき\\n一番重視してるのって何？\\n\\n① 技術\\n② 雰囲気\\n③ 通いやすさ\\n④ スタイリストとの相性\\n\\nsoraは④だと思ってて。\\nだからまずはDMで\\n気軽にお話しできたらなと思ってます。\",\"Threads用テンプレ例\":\"美容室選ぶとき一番大事なのって何？\\n\\nsoraは「この人になら任せられる」って\\n思える相性やと思うねんけど。\\n\\n技術がいくらうまくても\\n話しにくかったらしんどいし。\\n\\nみんなはどう？教えて。\",\"使えるシーン\":\"ストーリーズ：アンケート\\nThreads：問いかけ投稿\\nフィード：カルーセルQ&A\",\"参考（伸びてるアカウントの傾向）\":\"問いかけ投稿はリプライ率UP\\nアルゴリズムにも好影響\\nThreadsでは特に効果的\"}", "status": "draft", "memo": ""}, {"id": 25, "sheet_id": 2, "row_number": 8, "col_data": "{\"No.\":\"7\",\"フレーム名\":\"変身ストーリーフレーム\\n（お客様密着型）\",\"構造\":\"① お客様の来店経緯\\n② 最初の不安・悩み\\n③ カウンセリングの様子\\n④ 施術→仕上がり\\n⑤ お客様の感想\\n※お客様の許可必須\",\"IG用テンプレ例\":\"【 彼女がsoraを選んでくれた理由 】\\n\\n「3年間、ずっとIGを見てました」\\n\\nそう言って来てくれたお客様。\\n\\n髪が細くてボリュームが出ない。\\n何度も他のサロンで相談したけど\\n「エクステは…」と断られてきた。\\n\\nsoraは絶対断らない。\\n一緒に考えて、一緒に選ぶ。\\n\\n仕上がりとお客様の言葉、\\nnoteに書かせてもらいました。\",\"Threads用テンプレ例\":\"今日来てくれたお客様の話。\\n\\n3年IG見てくれてたらしい。\\n「ずっと行きたかったけど\\n奈良まで行く勇気がなかった」って。\\n\\n施術後に「来てよかった」って\\n言ってもらえて、泣きそうやった。\\n\\nこういう出会いがあるから\\nsoraは新大宮でやってる。\",\"使えるシーン\":\"フィード：密着カルーセル\\nリール：変身ストーリー\\nThreads：こぼれ話\\nnote：詳細記事\",\"参考（伸びてるアカウントの傾向）\":\"「お客様ストーリー」は\\n最も保存率・共感率が高いフォーマット\\n他のお客様が自分を重ねやすい\"}", "status": "draft", "memo": ""}, {"id": 26, "sheet_id": 3, "row_number": 3, "col_data": "{\"No.\":\"1\",\"ターゲット\":\"JK\",\"テーマ\":\"「卒業したら絶対髪染める」あるある\",\"共感フック\":\"校則で染められない→卒業式終わったら即美容室予約。\\n「3年間我慢した」気持ちに共感。\\nsoraは卒業シーズンの味方。\\n高校生活の間ずっとIG見てくれてた子が\\n卒業式の翌日に来てくれる、あの感動。\",\"IG投稿テンプレ\":\"【 3年間、我慢した髪を解放しよう 】\\n\\n校則で染められなかった3年間。\\n卒業式が終わった瞬間、\\n「やっと好きな髪にできる」って\\n思ってる子、いっぱいいるよね。\\n\\nsoraはそんな子の味方です。\\n\\n卒業→初カラー→エクステで\\n「別人じゃん！」って言われる\\n最高のスタートを一緒に作ろう。\\n\\n春のイメチェン相談、DMで待ってます。\",\"Threads投稿テンプレ\":\"卒業式終わった瞬間に\\n美容室予約する子、めっちゃ好き。笑\\n\\n「3年間ずっと我慢してました」\\nって言いながら来てくれる子が\\n毎年春にいるねんけど、\\nその子たちの目がキラキラしてて\\nsoraも毎回泣きそうになる。\\n\\n今年ももう予約入り始めてるよ。\\n卒業したらすぐ来てな。\\n新大宮で待ってるから。\",\"関連ハッシュタグ\":\"#卒業ヘア #卒業式 #イメチェン\\n#高校卒業 #垢抜け\\n#奈良JK #soraのエクステ\"}", "status": "draft", "memo": ""}, {"id": 27, "sheet_id": 3, "row_number": 4, "col_data": "{\"No.\":\"2\",\"ターゲット\":\"JD\",\"テーマ\":\"「大学デビュー 垢抜けたい」\",\"共感フック\":\"入学式までにイメチェンしたい。\\n「高校時代と全然違う」って言われたい。\\n2026年トレンドの「エフォートレス」ヘアを\\nsoraが提案。\\n大学デビューは見た目から。\",\"IG投稿テンプレ\":\"【 入学式までに「別人」になりたいあなたへ 】\\n\\n大学デビュー、本気で垢抜けたい。\\n\\n「高校の時と全然違う！」\\nって言われたくない？\\n\\n2026年は「エフォートレス」がトレンド。\\n頑張りすぎてない、でもおしゃれ。\\nエクステで自然にボリュームUP→\\n巻くだけで今っぽくなる。\\n\\nsoraと一緒に\\n新しい自分、つくろう。\\n\\nDMで「大学デビューしたい」って\\n送ってくれるだけでOKやで。\",\"Threads投稿テンプレ\":\"大学デビューで垢抜けたい子、\\nsoraが本気で応援する。\\n\\n高校の時「ダサい」って\\n思われてたかもしれへんけど\\n大学からは自由やん。\\n\\n髪変えるだけで\\nマジで印象変わるから。\\n\\n入学式に間に合うように\\n早めに相談してな。\\nDMいつでも待ってる。\",\"関連ハッシュタグ\":\"#大学デビュー #垢抜け #イメチェン\\n#入学式ヘア #春ヘア\\n#奈良女子大 #soraのエクステ\"}", "status": "draft", "memo": ""}, {"id": 28, "sheet_id": 3, "row_number": 5, "col_data": "{\"No.\":\"3\",\"ターゲット\":\"JK/JD\",\"テーマ\":\"「奈良なんもないって言われる問題」\",\"共感フック\":\"県外の人に「何もない」って言われるたびに\\n「いやあるねん…」。\\n鹿と大仏しか言われへん。\\nでもsoraは奈良が好き。\\n奈良で暮らす女の子の「地元愛」に共感。\",\"IG投稿テンプレ\":\"【 奈良、なんもなくないから 】\\n\\n「奈良って何もないよね？」\\nって県外の友達に言われたこと、\\nない？\\n\\nいやいや、あるねん。\\n\\nおしゃれカフェも、映えスポットも、\\n美味しいごはん屋さんも。\\n\\nそして、腕のいい美容師も。笑\\n\\nsoraは奈良が大好き。\\nこの街で「可愛い」を作ってます。\\n\\n奈良の良さ、一緒に発信しよ。\",\"Threads投稿テンプレ\":\"県外の友達に\\n「奈良って何もないよね」\\nって言われるたびに\\n\\n「いやあるねん…」\\nってなるの、奈良民あるあるすぎん？\\n\\n鹿と大仏しか出てこんのよ。笑\\n\\nでもさ、CHAMIもLuce*もあるし\\nならまちおしゃれやし\\nsoraみたいな美容師もおるし。\\n\\n奈良、ちゃんとええとこやで。\",\"関連ハッシュタグ\":\"#奈良あるある #奈良好き\\n#奈良JK #奈良女子\\n#奈良カフェ #soraのエクステ\"}", "status": "draft", "memo": ""}, {"id": 29, "sheet_id": 3, "row_number": 6, "col_data": "{\"No.\":\"4\",\"ターゲット\":\"JK\",\"テーマ\":\"「行基さん前で待ち合わせ」あるある\",\"共感フック\":\"近鉄奈良駅の行基像前は暗黙の待ち合わせスポット。\\n「行基さん前ね」で全員通じる奈良民。\\n奈良のJKなら絶対わかるネタで親近感。\",\"IG投稿テンプレ\":\"【 奈良民の待ち合わせスポット、決まってる説 】\\n\\n「行基さん前ね」\\n\\nこの一言で全員集合できる奈良。\\n\\n近鉄奈良のあの銅像の前、\\n何回待ち合わせしたかわからん。\\n\\n放課後、友達と行基さん前で合流して\\nならまち散策するのが青春やった。\\n\\nsoraも奈良民やから\\nこの感覚めっちゃわかる。\",\"Threads投稿テンプレ\":\"「行基さん前ね」\\n\\nこれで通じるの、奈良民だけ説。笑\\n\\n近鉄奈良駅の改札出て\\nあの銅像の前に集合。\\n\\n雨の日も暑い日も\\nとりあえず行基さん前。\\n\\n他県の人に説明すると\\n「誰？」って言われるけど\\n奈良では常識よな。\\n\\nわかる人、手挙げて。\",\"関連ハッシュタグ\":\"#奈良あるある #近鉄奈良\\n#行基さん #奈良JK\\n#奈良の日常 #奈良民\"}", "status": "draft", "memo": ""}, {"id": 30, "sheet_id": 3, "row_number": 7, "col_data": "{\"No.\":\"5\",\"ターゲット\":\"JD\",\"テーマ\":\"「奈良女子大の空きコマカフェ巡り」\",\"共感フック\":\"CHAMI、CAFE Luce*、喫茶デイジー。\\n奈良女の学生が空きコマに行くカフェは\\nだいたい決まってる。\\n大学生活のリアルに寄り添う。\",\"IG投稿テンプレ\":\"【 空きコマの使い方、カフェ巡りになりがち 】\\n\\n奈良女子大の周り、\\n実はカフェ激戦区って知ってた？\\n\\nCHAMIのマスカットタルト、\\nLuce*のシフォンケーキ、\\n喫茶デイジーのレトロな雰囲気。\\n\\n空きコマのたびに\\n新しいお店開拓してる子、\\nsoraと気が合うと思う。笑\\n\\n髪もカフェも、おすすめあるよ。\",\"Threads投稿テンプレ\":\"空きコマでカフェ行くの、\\n大学生の特権よな。\\n\\nsoraのおすすめは\\nCHAMIのプレミアムマスカットタルト。\\nあれ食べたことない人、\\n人生損してる。笑\\n\\nLuce*のシフォンケーキも最高やし\\n喫茶デイジーのレトロ感も好き。\\n\\n奈良のカフェ情報、交換しよ。\\nおすすめあったら教えて！\",\"関連ハッシュタグ\":\"#奈良カフェ #奈良女子大\\n#空きコマ #カフェ巡り\\n#CHAMI #奈良スイーツ\"}", "status": "draft", "memo": ""}, {"id": 31, "sheet_id": 3, "row_number": 8, "col_data": "{\"No.\":\"6\",\"ターゲット\":\"JK/JD\",\"テーマ\":\"「ミ・ナーラのラウンドワン帰りあるある」\",\"共感フック\":\"新大宮のミ・ナーラでプリクラ→ラウンドワン→\\nフードコート。奈良の放課後の定番コース。\\nsoraサロンの最寄りエリアのネタで親近感。\",\"IG投稿テンプレ\":\"【 ミ・ナーラの放課後コース、みんな同じ説 】\\n\\nプリクラ撮って、\\nラウンドワンで遊んで、\\nフードコートでだらだら。\\n\\n新大宮のミ・ナーラ、\\n奈良の学生ならみんな通る道。笑\\n\\nちなみにsoraのサロンも新大宮。\\nミ・ナーラ帰りに寄れる距離やで。\\n\\n次遊びに来たとき、\\n髪も可愛くして帰らん？\",\"Threads投稿テンプレ\":\"ミ・ナーラのラウンドワン帰り、\\n絶対フードコート寄るよな。笑\\n\\nプリクラ→ボウリング→\\nフードコートのたこ焼き。\\n\\nこのコースを何回やったことか。\\n\\nちなみにsoraのサロン、\\nミ・ナーラから近いねん。\\n\\n遊んだ帰りに髪の相談、\\nいつでもおいでや。\",\"関連ハッシュタグ\":\"#ミナーラ #新大宮\\n#奈良の放課後 #ラウンドワン\\n#奈良JK #プリクラ\"}", "status": "draft", "memo": ""}, {"id": 32, "sheet_id": 3, "row_number": 9, "col_data": "{\"No.\":\"7\",\"ターゲット\":\"JK/JD\",\"テーマ\":\"「大阪まで30分、でも奈良が好き」\",\"共感フック\":\"遊ぶのは大阪。でも帰ってくると安心する。\\n奈良ってそういう場所。\\n「地元が好き」の気持ちに寄り添う。\",\"IG投稿テンプレ\":\"【 遊びは大阪、でも帰る場所は奈良 】\\n\\n難波まで30分。\\n休みの日は大阪で遊ぶ。\\n\\nでも近鉄で奈良に帰ってきたとき\\nなんか安心するの、わかる？\\n\\n奈良ってそういう場所やねん。\\n\\nsoraも奈良が好きで\\nここでサロンやってる。\\n\\n奈良の子は奈良で可愛くなろ。\",\"Threads投稿テンプレ\":\"大阪で遊んで\\n近鉄で奈良帰ってきたとき\\n\\nあの空気感にホッとするの\\n奈良民あるあるやと思うねんけど。\\n\\n「大阪のほうが楽しいやん」\\nって言われるけど\\n奈良ってなんか落ち着くねん。\\n\\nsoraも奈良が好きで\\nここから離れられへん。\\n\\n同じ気持ちの人、おる？\",\"関連ハッシュタグ\":\"#奈良が好き #奈良あるある\\n#奈良暮らし #近鉄奈良線\\n#大阪 #地元愛\"}", "status": "draft", "memo": ""}, {"id": 33, "sheet_id": 3, "row_number": 10, "col_data": "{\"No.\":\"8\",\"ターゲット\":\"JD\",\"テーマ\":\"「就活前にイメチェンしたい」\",\"共感フック\":\"3回生の夏、インターン前に垢抜けたい。\\n暗めカラー+エクステでちゃんと見えるのにおしゃれ。\\n就活ヘアでも可愛くいたいJDの味方。\",\"IG投稿テンプレ\":\"【 就活ヘア、ちゃんと見えるのに可愛くしたい 】\\n\\n3回生の夏、そろそろ就活モード。\\n\\n「黒髪にしなきゃ」\\n「ちゃんとした印象にしなきゃ」\\n\\nでも、可愛くいたい気持ちは\\n捨てなくていいよ。\\n\\n暗めカラー+エクステで\\n清潔感あるのにおしゃれ。\\n\\nsoraが「ちゃんと×可愛い」\\n一緒に作るから。\\n\\nインターン前に相談してな。\",\"Threads投稿テンプレ\":\"就活で黒髪にしなきゃ、\\nって焦ってる3回生の子へ。\\n\\n「ちゃんと見える」と\\n「可愛い」は両立できるよ。\\n\\n暗めトーンでも\\nエクステでツヤ感とボリューム出すと\\n印象全然違うから。\\n\\nsoraは就活ヘアも得意やで。\\n「面接官ウケ×おしゃれ」\\n一緒に作ろ。\",\"関連ハッシュタグ\":\"#就活ヘア #就活準備\\n#インターン #垢抜け\\n#大学3回生 #soraのエクステ\"}", "status": "draft", "memo": ""}, {"id": 34, "sheet_id": 3, "row_number": 11, "col_data": "{\"No.\":\"9\",\"ターゲット\":\"JK\",\"テーマ\":\"「文化祭・体育祭で可愛くしたい」\",\"共感フック\":\"イベントの日だけ特別なヘアアレンジ。\\n校則内でも可愛くなりたい。\\nsoraに事前相談で当日最高の仕上がりに。\",\"IG投稿テンプレ\":\"【 文化祭の日、一番可愛い自分でいたい 】\\n\\n文化祭、体育祭。\\n高校生活の中で写真いっぱい撮る日。\\n\\n校則あるから派手にはできへんけど\\nアレンジ次第で全然変わるよ。\\n\\n三つ編みの入れ方、\\n後れ毛の出し方、\\nちょっとしたコツで「あの子可愛い」に。\\n\\nsoraに事前に相談してくれたら\\n当日のアレンジ方法教えるよ。\\nDMで「文化祭」って送って！\",\"Threads投稿テンプレ\":\"文化祭の日だけは\\n絶対可愛くいたいよな。\\n\\n校則あっても\\nアレンジ次第で全然違うから。\\n\\nsoraは「校則内で最大限可愛くする」\\nのが得意やねん。笑\\n\\n文化祭・体育祭の前に\\nDMで相談してくれたら\\nアレンジのコツ教えるで。\\n\\n「文化祭」ってDMしてね。\",\"関連ハッシュタグ\":\"#文化祭ヘア #体育祭 #校則\\n#ヘアアレンジ #可愛くなりたい\\n#奈良JK #高校生活\"}", "status": "draft", "memo": ""}, {"id": 35, "sheet_id": 3, "row_number": 12, "col_data": "{\"No.\":\"10\",\"ターゲット\":\"JK/JD\",\"テーマ\":\"「プリクラで盛れる髪になりたい」\",\"共感フック\":\"2026年トレンドはレタッチ薄めのナチュラル盛り。\\nエクステで自然にボリュームアップ→プリクラ映え。\\n「盛れる」は最強のモチベーション。\",\"IG投稿テンプレ\":\"【 プリクラで一番盛れる髪、知りたくない？ 】\\n\\n2026年のプリクラ、\\nレタッチ薄めが主流になってきてるから\\n素の髪が大事になってきてる。\\n\\n自然にボリュームがある髪\\n→プリクラで最強に盛れる。\\n\\nエクステでナチュラルにボリュームUPしたら\\n加工なしでも可愛く撮れるよ。\\n\\n「プリクラ盛れる髪にしたい」\\nってDMしてくれたら相談乗るで！\",\"Threads投稿テンプレ\":\"プリクラの盛れ方、\\n2026年は「ナチュラル」がキテる。\\n\\nレタッチ薄めで撮る子増えてきて\\n素の髪のボリューム感が大事になってきた。\\n\\nエクステで自然に増やすと\\nプリクラの仕上がり全然違うで。\\n\\nミ・ナーラのプリクラ撮る前に\\nsoraに寄ってくれたら\\n最高に盛れる髪にするから。笑\",\"関連ハッシュタグ\":\"#プリクラ #盛れる #ナチュラル\\n#2026トレンド #髪型\\n#エクステ #奈良女子\"}", "status": "draft", "memo": ""}, {"id": 36, "sheet_id": 3, "row_number": 13, "col_data": "{\"No.\":\"11\",\"ターゲット\":\"JD\",\"テーマ\":\"「成人式・卒業式のためのエクステ」\",\"共感フック\":\"一生の記念日。写真に残るから絶対失敗したくない。\\n振袖/袴×エクステの提案。\\nsoraが「一生モノの写真」のお手伝い。\",\"IG投稿テンプレ\":\"【 一生に一度の日、髪で後悔したくない 】\\n\\n成人式、卒業式。\\n写真に残る日だから\\n絶対に失敗したくないよね。\\n\\n振袖や袴に合うヘアスタイル、\\nエクステで華やかさをプラスすると\\n写真映えが全然違う。\\n\\nsoraは「一生モノの記念日ヘア」を\\n全力でお手伝いします。\\n\\n早めの相談がおすすめ。\\nDMで「成人式」or「卒業式」って\\n送ってね。\",\"Threads投稿テンプレ\":\"成人式のヘアセット、\\n写真に一生残るから\\nほんまに大事やねん。\\n\\n振袖にエクステ合わせると\\n華やかさが全然違う。\\n\\n「当日ボリューム足りなかったらどうしよう」\\nって不安な子、\\nsoraに相談してくれたら\\n一緒にベストなプラン考えるから。\\n\\n卒業式の袴ヘアも任せて。\\n一生の記念日、最高にしよ。\",\"関連ハッシュタグ\":\"#成人式ヘア #振袖ヘア\\n#卒業式ヘア #袴ヘア\\n#エクステ #記念日ヘア\\n#奈良成人式 #soraのエクステ\"}", "status": "draft", "memo": ""}, {"id": 37, "sheet_id": 3, "row_number": 14, "col_data": "{\"No.\":\"12\",\"ターゲット\":\"JK/JD\",\"テーマ\":\"「パサつき・乾燥が実は10代から」\",\"共感フック\":\"10代20代女性の髪の悩み1位は\\n「パサつき・乾燥」（セプテム総研2025調査）。\\n若いからって悩まないわけじゃない。\\nsoraは年齢関係なく髪の悩みに向き合う。\",\"IG投稿テンプレ\":\"【 若いから大丈夫、なんてことない 】\\n\\n10代20代の女性の髪の悩み1位、\\n知ってる？\\n\\n「パサつき・乾燥」。\\n（セプテム総研 2025年調査）\\n\\n若いから悩まないでしょ、\\nなんて思われがちやけど\\n実はめっちゃ悩んでる子、多い。\\n\\nsoraに来てくれる10代の子も\\n「パサつきが嫌で…」って言う。\\n\\n年齢関係なく、髪の悩みは悩み。\\nsoraが一緒に向き合うから\\n気軽にDMしてね。\",\"Threads投稿テンプレ\":\"10代20代の髪の悩み1位が\\n「パサつき・乾燥」って知ってた？\\n\\nセプテム総研の2025年調査なんやけど\\n「若いから大丈夫でしょ」\\nって言われがちやん？\\n\\nでも実際めっちゃ悩んでる子多いねん。\\n\\nsoraのお客様にも10代の子いるよ。\\n年齢関係なく、悩みは悩み。\\n\\n「こんなことで相談していいのかな」\\nって思ってる子、\\n全然いいから。DMおいで。\",\"関連ハッシュタグ\":\"#髪の悩み #パサつき #乾燥\\n#10代 #20代 #ヘアケア\\n#奈良女子 #soraのエクステ\"}", "status": "draft", "memo": ""}, {"id": 38, "sheet_id": 4, "row_number": 3, "col_data": "{\"指標\":\"DMシェア率\",\"重要度\":\"★★★★★（最重要）\",\"目標値\":\"全インタラクションの25%以上\",\"soraの対策\":\"「これ友達にも見せたい」と思わせる。あるある系・BA変身系が最もシェアされる\"}", "status": "draft", "memo": ""}, {"id": 39, "sheet_id": 4, "row_number": 4, "col_data": "{\"指標\":\"保存率\",\"重要度\":\"★★★★★\",\"目標値\":\"2-3%以上\",\"soraの対策\":\"「後で見返したい」情報を入れる。本数ガイド・ケアTips・あるある系\"}", "status": "draft", "memo": ""}, {"id": 40, "sheet_id": 4, "row_number": 5, "col_data": "{\"指標\":\"再生完了率\",\"重要度\":\"★★★★☆\",\"目標値\":\"40-60%\",\"soraの対策\":\"15-30秒が最適。冒頭3秒でフック→中盤で価値提供→ラストCTA\"}", "status": "draft", "memo": ""}, {"id": 41, "sheet_id": 4, "row_number": 6, "col_data": "{\"指標\":\"冒頭3秒離脱率\",\"重要度\":\"★★★★☆\",\"目標値\":\"45%以下\",\"soraの対策\":\"「悩みテロップ」or「衝撃BA」or「問いかけ」で手を止める\"}", "status": "draft", "memo": ""}, {"id": 42, "sheet_id": 4, "row_number": 7, "col_data": "{\"指標\":\"コメント率\",\"重要度\":\"★★★☆☆\",\"目標値\":\"1%以上\",\"soraの対策\":\"問いかけ・あるある・クイズ形式で自然にコメントを誘う\"}", "status": "draft", "memo": ""}, {"id": 43, "sheet_id": 4, "row_number": 8, "col_data": "{\"指標\":\"リプライ率（Threads）\",\"重要度\":\"★★★★★\",\"目標値\":\"-\",\"soraの対策\":\"共感系・問いかけ・あるあるで「わかる」のリプを誘う\"}", "status": "draft", "memo": ""}, {"id": 44, "sheet_id": 4, "row_number": 10, "col_data": "{\"指標\":\"バズる冒頭フック 10パターン\"}", "status": "draft", "memo": ""}, {"id": 45, "sheet_id": 4, "row_number": 11, "col_data": "{\"指標\":\"No.\",\"重要度\":\"フックパターン\",\"目標値\":\"構造\",\"soraの対策\":\"sora用テンプレ例\"}", "status": "draft", "memo": ""}, {"id": 46, "sheet_id": 4, "row_number": 12, "col_data": "{\"指標\":\"1\",\"重要度\":\"衝撃結果先出し\",\"目標値\":\"Before→3秒で衝撃After\",\"soraの対策\":\"「この変化、たった2時間です」→After映像ドン\"}", "status": "draft", "memo": ""}, {"id": 47, "sheet_id": 4, "row_number": 13, "col_data": "{\"指標\":\"2\",\"重要度\":\"禁止フック\",\"目標値\":\"「◯◯しないで」で逆に見たくさせる\",\"soraの対策\":\"「エクステ選び、これだけはやらないで」\"}", "status": "draft", "memo": ""}, {"id": 48, "sheet_id": 4, "row_number": 14, "col_data": "{\"指標\":\"3\",\"重要度\":\"数字フック\",\"目標値\":\"具体的な数字で信頼と驚き\",\"soraの対策\":\"「20代女性の32%が感じてる髪の悩み」\"}", "status": "draft", "memo": ""}, {"id": 49, "sheet_id": 4, "row_number": 15, "col_data": "{\"指標\":\"4\",\"重要度\":\"問いかけフック\",\"目標値\":\"質問で手を止める（完了率82%）\",\"soraの対策\":\"「これ当てはまる人、何個ある？」\"}", "status": "draft", "memo": ""}, {"id": 50, "sheet_id": 4, "row_number": 16, "col_data": "{\"指標\":\"5\",\"重要度\":\"ギャップフック\",\"目標値\":\"予想を裏切る展開\",\"soraの対策\":\"「エクステ＝派手」だと思ってた人、見て\"}", "status": "draft", "memo": ""}, {"id": 51, "sheet_id": 4, "row_number": 17, "col_data": "{\"指標\":\"6\",\"重要度\":\"告白フック\",\"目標値\":\"個人的な話で共感を引く\",\"soraの対策\":\"「美容師が言いにくいこと、正直に言います」\"}", "status": "draft", "memo": ""}, {"id": 52, "sheet_id": 4, "row_number": 18, "col_data": "{\"指標\":\"7\",\"重要度\":\"あるある連射フック\",\"目標値\":\"テンポよく共感を重ねる\",\"soraの対策\":\"「当てはまったら要注意」→あるある5連発\"}", "status": "draft", "memo": ""}, {"id": 53, "sheet_id": 4, "row_number": 19, "col_data": "{\"指標\":\"8\",\"重要度\":\"時限フック\",\"目標値\":\"「◯◯する前に見て」で緊急性\",\"soraの対策\":\"「エクステつける前にこれ見て」\"}", "status": "draft", "memo": ""}, {"id": 54, "sheet_id": 4, "row_number": 20, "col_data": "{\"指標\":\"9\",\"重要度\":\"対比フック\",\"目標値\":\"一般vs専門家の対比\",\"soraの対策\":\"「普通の人の髪の乾かし方 vs 美容師の乾かし方」\"}", "status": "draft", "memo": ""}, {"id": 55, "sheet_id": 4, "row_number": 21, "col_data": "{\"指標\":\"10\",\"重要度\":\"感情先出しフック\",\"目標値\":\"感動や驚きの感情を先に\",\"soraの対策\":\"「お客様が泣いた。その理由は…」\"}", "status": "draft", "memo": ""}, {"id": 56, "sheet_id": 4, "row_number": 23, "col_data": "{\"指標\":\"バズるリール 必勝フォーマット 8本\"}", "status": "draft", "memo": ""}, {"id": 57, "sheet_id": 4, "row_number": 24, "col_data": "{\"指標\":\"No.\",\"重要度\":\"フォーマット名\",\"目標値\":\"構成（秒数）\",\"soraの対策\":\"soraの具体的な投稿案\"}", "status": "draft", "memo": ""}, {"id": 58, "sheet_id": 4, "row_number": 25, "col_data": "{\"指標\":\"1\",\"重要度\":\"3秒変身チャレンジ\",\"目標値\":\"0-1s:Before暗い→1-3s:手で隠す→3s:パッとAfter華やか（計15秒ループ）\",\"soraの対策\":\"ぺたんこ髪→soraの手で隠す→エクステ後の巻き髪ドン。BGMのドロップに合わせる\"}", "status": "draft", "memo": ""}, {"id": 59, "sheet_id": 4, "row_number": 26, "col_data": "{\"指標\":\"2\",\"重要度\":\"やらないでシリーズ\",\"目標値\":\"0-3s:「エクステ選び、これだけはやらないで」→3-15s:NG行動3つ→15-20s:「正解はnoteで」\",\"soraの対策\":\"安いだけで選ぶ/写真だけで判断/ケア方法を聞かない の3つ\"}", "status": "draft", "memo": ""}, {"id": 60, "sheet_id": 4, "row_number": 27, "col_data": "{\"指標\":\"3\",\"重要度\":\"一般人vs美容師シリーズ\",\"目標値\":\"0-3s:画面分割で「一般人の巻き方/美容師の巻き方」→3-15s:実演対比→15-20s:コツ解説\",\"soraの対策\":\"同じコテでも持ち方・角度・巻く方向が全然違う\"}", "status": "draft", "memo": ""}, {"id": 61, "sheet_id": 4, "row_number": 28, "col_data": "{\"指標\":\"4\",\"重要度\":\"エクステあるある 当てはまったら〇〇\",\"目標値\":\"0-3s:「当てはまる数を数えて」→3-15s:あるある7連発（テンポ速め）→15-20s:「全部当てはまった人、DM来て」\",\"soraの対策\":\"エクステ気になる人あるある7選。最後に「soraも全部当てはまってた」\"}", "status": "draft", "memo": ""}, {"id": 62, "sheet_id": 4, "row_number": 29, "col_data": "{\"指標\":\"5\",\"重要度\":\"逆再生マジック\",\"目標値\":\"0-3s:完成形の巻き髪→逆再生でエクステを外していく→最後にBefore\",\"soraの対策\":\"美しい巻き髪が逆再生でぺたんこに戻っていく→「これが現実。でもsoraが変えます」\"}", "status": "draft", "memo": ""}, {"id": 63, "sheet_id": 4, "row_number": 30, "col_data": "{\"指標\":\"6\",\"重要度\":\"24時間キープ検証\",\"目標値\":\"0-3s:「本当に24時間持つ？」→朝・昼・夜・翌朝の4カット→最後に「持ちました」\",\"soraの対策\":\"朝セット→通勤→仕事後→翌朝まで同じスタイルをタイムラプスで\"}", "status": "draft", "memo": ""}, {"id": 64, "sheet_id": 4, "row_number": 31, "col_data": "{\"指標\":\"7\",\"重要度\":\"お客様の声 感動ドキュメント\",\"目標値\":\"0-3s:「3年間IGを見てくれてた人が来た」テロップ→3-20s:来店~施術~感想→20-30s:お客様の笑顔＋テロップ「来てよかった」\",\"soraの対策\":\"実際のお客様の来店から仕上がりまでをドキュメント風に。お客様の声は許可済みテロップで\"}", "status": "draft", "memo": ""}, {"id": 65, "sheet_id": 4, "row_number": 32, "col_data": "{\"指標\":\"8\",\"重要度\":\"奈良の美容師ルーティン × 映え\",\"目標値\":\"0-5s:新大宮の朝→5-15s:サロン→施術ハイライト→15-25s:奈良カフェ→鹿→夕景→25-30s:「奈良で待ってるよ」\",\"soraの対策\":\"奈良の美しい景色をシネマティックに撮る。BGMはチルな楽曲。地方美容師のおしゃれな日常\"}", "status": "draft", "memo": ""}, {"id": 66, "sheet_id": 4, "row_number": 34, "col_data": "{\"指標\":\"バズるThreads投稿 必勝フォーマット 8本\"}", "status": "draft", "memo": ""}, {"id": 67, "sheet_id": 4, "row_number": 35, "col_data": "{\"指標\":\"No.\",\"重要度\":\"フォーマット名\",\"目標値\":\"構造\",\"soraの対策\":\"soraの具体的な投稿案\"}", "status": "draft", "memo": ""}, {"id": 68, "sheet_id": 4, "row_number": 36, "col_data": "{\"指標\":\"1\",\"重要度\":\"〇〇な人だけいいねして\",\"目標値\":\"共感テーマ＋「いいね」でリアクションを求める\",\"soraの対策\":\"「エクステ気になってるけど踏み出せない人だけいいねして」\\n\\nsoraのお客様、最初はみんなそうだった。\\n踏み出した人は全員「もっと早くやればよかった」って言う。\\n\\nDMで相談だけでも大丈夫やで。\"}", "status": "draft", "memo": ""}, {"id": 69, "sheet_id": 4, "row_number": 37, "col_data": "{\"指標\":\"2\",\"重要度\":\"正直に言います系\",\"目標値\":\"美容師の本音をさらけ出す\",\"soraの対策\":\"美容師が正直に言いたいこと。\\n\\n・「何でもいいです」が一番困る\\n・参考画像あると本気出せる\\n・実は「似合う」と「やりたい」のバランスが大事\\n・エクステつけるかは最初から決めなくていい\\n\\nsoraは全部聴くから、なんでも話してね。\"}", "status": "draft", "memo": ""}, {"id": 70, "sheet_id": 4, "row_number": 38, "col_data": "{\"指標\":\"3\",\"重要度\":\"奈良で暮らしてて思うこと\",\"目標値\":\"ローカル×哲学的な一言\",\"soraの対策\":\"奈良って、急がない街やなって思う。\\n\\n大阪みたいにせかせかしてないし\\n京都みたいに気取ってない。\\n\\nのんびり鹿が歩いてて\\nみんなちょっと優しい。\\n\\nsoraが奈良でサロンやってる理由、\\nたぶんこれ。\"}", "status": "draft", "memo": ""}, {"id": 71, "sheet_id": 4, "row_number": 39, "col_data": "{\"指標\":\"4\",\"重要度\":\"地雷美容室の見分け方\",\"目標値\":\"ネガティブ情報で注目→soraの対比\",\"soraの対策\":\"エクステで失敗しない美容室の選び方。\\n\\n・カウンセリングが5分以下→危険\\n・「何本でも同じ」って言う→危険\\n・Before/Afterを見せてくれない→危険\\n・地毛との馴染み方を説明しない→危険\\n\\nsoraは最低30分カウンセリングする。\\nそこが一番大事やと思ってるから。\"}", "status": "draft", "memo": ""}, {"id": 72, "sheet_id": 4, "row_number": 40, "col_data": "{\"指標\":\"5\",\"重要度\":\"〇歳でこれ知らなかった\",\"目標値\":\"年齢×新発見で共感\",\"soraの対策\":\"25歳でこれ知らなかった。\\n\\n・エクステって「派手にする」だけじゃない\\n・ボリューム出すためにつける人のほうが多い\\n・地毛と見分けつかないレベルになる\\n・朝のセット時間が半分になる\\n\\nsoraのお客様の半分は\\n「ボリュームが欲しい」って理由。\"}", "status": "draft", "memo": ""}, {"id": 73, "sheet_id": 4, "row_number": 41, "col_data": "{\"指標\":\"6\",\"重要度\":\"みんなに聞きたい（投票型）\",\"目標値\":\"選択肢で参加ハードルを下げる\",\"soraの対策\":\"みんなに聞きたい。\\n\\n美容室で一番緊張する瞬間って？\\n\\nA. 電話予約するとき\\nB. 初めてのドアを開けるとき\\nC. 「今日どうしますか？」って聞かれるとき\\nD. 全部\\n\\nsoraはDM予約OKやし\\n「決まってないけど相談したい」でも大歓迎。\"}", "status": "draft", "memo": ""}, {"id": 74, "sheet_id": 4, "row_number": 42, "col_data": "{\"指標\":\"7\",\"重要度\":\"あの日の私に教えたい\",\"目標値\":\"過去の自分への手紙形式\",\"soraの対策\":\"美容師1年目の私に教えたいこと。\\n\\n・技術より「聴く力」のほうが大事\\n・お客様は「変わりたい」じゃなく「自信を持ちたい」\\n・エクステは「つける」じゃなく「寄り添う」\\n・奈良で一人でやるのは怖いけど、大丈夫\\n\\n今のsoraが言えるのはこれくらい。\"}", "status": "draft", "memo": ""}, {"id": 75, "sheet_id": 4, "row_number": 43, "col_data": "{\"指標\":\"8\",\"重要度\":\"これ、soraだけ？\",\"目標値\":\"自分の癖や習慣をさらけ出す\",\"soraの対策\":\"これsoraだけ？\\n\\n・お客様の髪触ると自然と笑顔になる\\n・施術後のAfter写真撮る時が一番テンション上がる\\n・休みの日も街で人の髪見てしまう\\n・奈良の鹿に「おはよう」って言ってしまう\\n\\n美容師あるあるなのか\\nsoraだけなのか教えて。笑\"}", "status": "draft", "memo": ""}, {"id": 76, "sheet_id": 4, "row_number": 45, "col_data": "{\"指標\":\"バズるフィード投稿 追加6本\"}", "status": "draft", "memo": ""}, {"id": 77, "sheet_id": 4, "row_number": 46, "col_data": "{\"指標\":\"No.\",\"重要度\":\"フォーマット名\",\"目標値\":\"テーマ\",\"soraの対策\":\"キャプション テンプレ\"}", "status": "draft", "memo": ""}, {"id": 78, "sheet_id": 4, "row_number": 47, "col_data": "{\"指標\":\"1\",\"重要度\":\"保存される本数ガイド\",\"目標値\":\"エクステ本数別 完全比較\",\"soraの対策\":\"【 保存推奨 】エクステ何本がいい？\\n\\n「何本つけたらいいかわからない」\\nこれ、一番聞かれる質問。\\n\\n60本：ちょい足し自然派\\n80本：一番人気！巻き髪映え\\n100本~：しっかり変化したい人\\n\\n巻いた時と下ろした時で\\n全然印象変わるから\\n4枚目に比較載せてます。\\n\\n保存して美容室で見せてね。\"}", "status": "draft", "memo": ""}, {"id": 79, "sheet_id": 4, "row_number": 48, "col_data": "{\"指標\":\"2\",\"重要度\":\"シェアされるNG集\",\"目標値\":\"エクステで絶対やっちゃダメなこと5選\",\"soraの対策\":\"【 友達にもシェアして 】\\n\\nエクステつける前に知ってほしい\\nNG行動5選。\\n\\n① 安さだけで選ぶ\\n② 施術事例を見ないで予約\\n③ カウンセリングを省略される\\n④ ケア方法を教えてもらわない\\n⑤ 「何でもいいです」と言う\\n\\nsoraに来る前の予習として\\n保存しておいてね。\"}", "status": "draft", "memo": ""}, {"id": 80, "sheet_id": 4, "row_number": 49, "col_data": "{\"指標\":\"3\",\"重要度\":\"感動ストーリー カルーセル\",\"目標値\":\"「人生変わった」お客様の物語\",\"soraの対策\":\"【 お客様の許可を得て掲載しています 】\\n\\n「3年間、ずっとsoraのIG見てました」\\n\\nそう言って初めて来てくれた彼女。\\n\\n実は髪のボリュームがずっとコンプレックスで\\n友達にも相談できなかったらしい。\\n\\n4枚目から読んでほしい。\\n\\n施術の詳細はnoteで。\"}", "status": "draft", "memo": ""}, {"id": 81, "sheet_id": 4, "row_number": 50, "col_data": "{\"指標\":\"4\",\"重要度\":\"クイズ形式 どっちがエクステ？\",\"目標値\":\"地毛vsエクステ 見分けがつかない検証\",\"soraの対策\":\"【 正解率5% 】\\n\\nどっちがエクステでしょう？\\n\\n正解は…4枚目！\\n\\n「バレたくない」\\n「自然がいい」\\n「地毛みたいにしたい」\\n\\n全部叶えます。\\nnoteにこだわりを書いてます。\"}", "status": "draft", "memo": ""}, {"id": 82, "sheet_id": 4, "row_number": 51, "col_data": "{\"指標\":\"5\",\"重要度\":\"季節×悩み 保存ガイド\",\"目標値\":\"梅雨/夏/秋/冬の髪悩み対策\",\"soraの対策\":\"【 奈良の梅雨を生き延びるヘアガイド 】\\n\\n奈良盆地の湿気、ほんまにやばい。\\n\\n朝セットしても新大宮着く頃には崩壊。\\n\\n✓ 湿気に負けないスタイリング法\\n✓ エクステで湿気に強い髪を作る方法\\n✓ 崩れにくい巻き方\\n\\n4枚目に全部まとめてます。\\n保存して梅雨を乗り越えよ。\"}", "status": "draft", "memo": ""}, {"id": 83, "sheet_id": 4, "row_number": 52, "col_data": "{\"指標\":\"6\",\"重要度\":\"数字で語る エクステの真実\",\"目標値\":\"データ×エクステの誤解を解く\",\"soraの対策\":\"【 エクステの真実を数字で 】\\n\\n・soraのお客様の52%は「初めてのエクステ」\\n・80%が「自然にしたい」が希望\\n・リピート率は◯◯%\\n・施術時間は平均2時間\\n・1本あたりの重さは約1g\\n\\n「エクステ＝派手」は過去の話。\\nnoteで詳しく解説してます。\"}", "status": "draft", "memo": ""}, {"id": 84, "sheet_id": 5, "row_number": 2, "col_data": "{\"No.\":\"1\",\"施策名\":\"施術後フォトタイム\",\"具体的なやり方\":\"施術完了後にスマホで撮影\\n「せっかくだから撮りましょうか？」\\n\\n窓際の自然光スポットを用意\\n3カット撮影（正面・横・後ろ）\\n\\nお客様のスマホでも撮ってあげる\\n→自分のIGに上げやすくなる\\n\\n★@mrrk__oro（1,976F/37投稿）は\\n写真の質だけで伸ばしている好例。\\n撮影クオリティは最重要。\",\"投稿テンプレート（リポスト時）\":\"（お客様が投稿した場合のリポスト）\\n\\n嬉しすぎるお言葉。\\n@◯◯さん、いつもありがとうございます。\\n\\n「自然で可愛い」を一緒に作れて\\nsoraも幸せです。\\n\\n#vent_cloud_sora #soraのエクステ\",\"注意点\":\"撮影・投稿の許可は必ず口頭+DMで確認\\n「顔出しNG」の方には後ろ姿で\\n無理強いしない、あくまで自然に\",\"期待効果\":\"UGC投稿が口コミとして機能\\n新規客の信頼獲得に直結\\n8ヶ月でUGC数6倍の事例あり\"}", "status": "draft", "memo": ""}, {"id": 85, "sheet_id": 5, "row_number": 3, "col_data": "{\"No.\":\"2\",\"施策名\":\"ハッシュタグキャンペーン\\n#soraのエクステ\",\"具体的なやり方\":\"#soraのエクステ で投稿してくれた方に\\n次回トリートメント無料\\n\\nストーリーズで毎月告知\\n「投稿してくれたら嬉しいです」の\\nスタンスで軽く案内\\n\\nリポスト前にDMで\\n「素敵な投稿ありがとう！\\nリポストしてもいい？」\\n\\n★参考：@nara_lunch_cafe は\\n#奈良ランチカフェ でUGCを集めて\\n43Kフォロワーを構築した実績あり\",\"投稿テンプレート（リポスト時）\":\"【 #soraのエクステ で投稿してくれました 】\\n\\n@◯◯さん、ありがとう！\\n\\nこの投稿見て「私も行きたい」って\\n思ってくれる人がいたら嬉しいな。\\n\\n同じ悩みの方、DMで相談してね。\",\"注意点\":\"#soraのエクステ を定着させる\\n月に1人でもUGCが出れば成功\\n無理なノルマは絶対NG\",\"期待効果\":\"参加障壁が低い\\nお客様が自発的に宣伝してくれる\\nハッシュタグ検索からの新規流入\"}", "status": "draft", "memo": ""}, {"id": 86, "sheet_id": 5, "row_number": 4, "col_data": "{\"No.\":\"3\",\"施策名\":\"お客様DM紹介\\n（許可制）\",\"具体的なやり方\":\"施術後にいただいた感想DMを\\nスクショでストーリーズに掲載\\n\\n「この声、同じ悩みの方に\\n届いてほしいから載せていい？」\\nとDMで許可を取る\\n\\n名前はイニシャルor伏せ字で\",\"投稿テンプレート（リポスト時）\":\"（ストーリーズ用）\\n\\n「初めてのエクステ、不安だったけど\\nsoraさんが全部聞いてくれて安心でした」\\n\\n--- お客様DMより（許可済み）---\\n\\nこういう声が一番の宝物。\\n初めての方も、安心してDMしてね。\",\"注意点\":\"名前・顔は必ず伏せる（許可があっても配慮）\\nポジティブな声のみ掲載\\n「載せてくれてありがとう」のDMも忘れずに\",\"期待効果\":\"リアルな声は広告より信頼度40%UP\\n「この人のお客様は満足してるんだ」\\nという安心感を作れる\"}", "status": "draft", "memo": ""}, {"id": 87, "sheet_id": 5, "row_number": 5, "col_data": "{\"No.\":\"4\",\"施策名\":\"Threadsでお客様の\\n投稿にリプ\",\"具体的なやり方\":\"お客様がThreadsで美容/奈良ネタを\\n投稿していたら、soraからリプライ\\n\\n「素敵ですね！」ではなく\\nパーソナルなコメントを心がける\\n\\n例：「このカフェ私も好き！\\n◯◯のスコーンが最高よね」\",\"投稿テンプレート（リポスト時）\":\"（リプライの書き方テンプレ）\\n\\n美容ネタ→「わかる！soraも◯◯派」\\nカフェネタ→「ここ好き！◯◯おすすめ」\\n奈良ネタ→「奈良民として共感しかない」\\n\\n※毎回noteに誘導しない。\\n3回に1回くらいの頻度で自然に。\",\"注意点\":\"営業感を出さない\\nリプは「友達として」の距離感\\n投稿の数時間以内にリプするとベスト\",\"期待効果\":\"お客様との関係値維持\\nフォロワーのタイムラインに表示される\\n→soraの認知拡大\"}", "status": "draft", "memo": ""}, {"id": 88, "sheet_id": 5, "row_number": 6, "col_data": "{\"No.\":\"5\",\"施策名\":\"★奈良メディア\\nクロスエンゲージ\\n（最速認知戦略）\",\"具体的なやり方\":\"【重点攻略アカウント】\\n\\n① @nara_select（110K IG / 12K Threads）\\n→ リール投稿に「行きたい！」系リプ\\n→ 奈良スポットの引用リポスト\\n→ CTA手法を自分の投稿にも応用\\n\\n② @nara_lunch_cafe（43K IG / 6.8K Threads）\\n→ カフェ投稿に「ここ好き！」系リプ\\n→ 引用リポストで「soraも行った」\\n→ UGCハッシュタグ戦略を参考に\\n\\n③ 奈良在住の女性アカウント全般\\n→ 地元ネタに共感リプを積み重ねる\",\"投稿テンプレート（リポスト時）\":\"（引用リポスト テンプレ）\\n\\nパターンA（@nara_select投稿に対して）\\nここ行ったことある！\\n新大宮から近くて\\n施術後のご褒美にぴったり。\\n奈良ってこういう穴場が多いから好き。\\n\\nパターンB（@nara_lunch_cafe投稿に対して）\\nこのお店めっちゃ気になってた！\\n休みの日に行ってみよ。\\n奈良のカフェ、レベル高いよなぁ。\\n\\nパターンC（奈良あるあるに対して）\\n奈良民として共感しかない。笑\\nこれ県外の人に説明しても伝わらんよね。\",\"注意点\":\"引用リポストは「元投稿への\\nリスペクト」が前提\\n美容と関係ない投稿でOK\\n（soraの「人柄」を見せる場）\\n\\n頻度：週2-3回\\n目標：奈良クラスタから\\n「この美容師よく見るな」と\\n認知されること\",\"期待効果\":\"最速の認知拡大ルート\\n@nara_selectの110Kフォロワー、\\n@nara_lunch_cafeの43Kフォロワーの\\nタイムラインにsoraが表示される\\n\\n「奈良好きの美容師」として\\n自然にポジションを確立\"}", "status": "draft", "memo": ""}, {"id": 89, "sheet_id": 5, "row_number": 7, "col_data": "{\"No.\":\"6\",\"施策名\":\"ストーリーズ\\nアンケート・投票\",\"具体的なやり方\":\"週1-2回のストーリーズで参加型コンテンツ\\n\\n例：\\n「今日のランチどっち？」\\n「エクステ60本vs80本、どっちが好み？」\\n「奈良のおすすめカフェ教えて！」\\n\\n結果をThreadsでシェア\\n\\n★@nara_select式CTAを応用：\\n「気になった人は〇ってコメントしてね！」\",\"投稿テンプレート（リポスト時）\":\"（結果シェア テンプレ）\\n\\nストーリーズで聞いた\\n「エクステ何本が好み？」の結果。\\n\\n80本が一番人気やった！\\nyっぱり「自然だけどちゃんと変わる」が\\nみんなの理想なんやね。\\n\\nnoteに本数別の解説書いてるから\\n迷ってる人は見てみて。\",\"注意点\":\"選択肢は2択がベスト（迷わない）\\n結果発表を忘れない\\n「みんなのおかげで面白いデータ取れた」感\",\"期待効果\":\"エンゲージメント率UP\\nアルゴリズムに好影響\\nフォロワーとの双方向コミュニケーション\"}", "status": "draft", "memo": ""}, {"id": 90, "sheet_id": 6, "row_number": 3, "col_data": "{\"No.\":\"1\",\"カテゴリ\":\"定番スポット\",\"ネタ\":\"行基さん前（近鉄奈良駅）\",\"投稿での使い方例\":\"待ち合わせあるあるネタ\\n「行基さん前ね」で全員通じる\\nJK/JDの放課後ネタに最適\",\"季節/タイミング\":\"通年\",\"備考\":\"奈良県民の暗黙の了解\\n県外の人には通じない鉄板ネタ\"}", " ta": "{\"No.\":\"25\",\"カテゴリ\":\"気候\",\"ネタ\":\"奈良の冬の底冷え\",\"投稿での使い方例\":\"盆地だから冬めっちゃ寒い。静電気×髪\\n「奈良の冬、髪パッサパサになるよな」\",\"季節/タイミング\":\"12-2月\",\"備考\":\"★乾燥×髪パサつきネタ\\n冬のヘアケア提案に繋げる\"}", "status": "draft", "memo": ""}, {"id": 115, "sheet_id": 7, "row_number": 1, "col_data": "{\"No.\":\"1\",\"カテゴリ\":\"施術事例\\n（悩み起点）\",\"投稿テーマ\":\"エクステ Before/After\",\"共感フック\":\"悩み正当化\\n+B→I→Aフレーム\\n\\n「ぺたんこ髪」\\n「巻いても持たない」\\nなど具体的な悩みから入る\\n\\n★@ivan_liz_との差別化：\\nBAだけでなく\\n悩みストーリーを必ず添える\",\"キャプション テンプレート\":\"【 巻いても夕方にはぺたんこだった髪が 】\\n\\n「夕方には全部取れてて\\n毎朝のセットが虚しかった」\\n\\nそんなお悩みのお客様でした。\\n\\n◯本のエクステで\\nボリュームと長さをプラスしたら\\n「夜まで巻きが持つようになった！」って。\\n\\n同じ悩みの方、けっこう多いです。\\nsoraに気軽に相談してくださいね。\\n\\n施術の詳細はnoteで。\",\"ビジュアル指示\":\"1枚目：After（巻き髪・自然光）\\n2枚目：Before\\n3枚目：お悩みテキストカード\\n4枚目：横・後ろアングル\\n※「私もこうなりたい」を作る\\n★@mrrk__oroレベルの\\n写真クオリティを目指す\",\"CTA\":\"→ note記事\",\"頻度\":\"週2回\"}", "status": "draft", "memo": ""}, {"id": 116, "sheet_id": 7, "row_number": 2, "col_data": "{\"No.\":\"2\",\"カテゴリ\":\"お客様の声\\n（リポスト型）\",\"投稿テーマ\":\"お客様の感想紹介\",\"共感フック\":\"お客様の声\\nリポストフレーム\\n\\n第三者の声を主役にする\\nsoraは添え物くらいで\",\"キャプション テンプレート\":\"【 お客様からのDM、泣きそうになった 】\\n\\n「友達に'髪きれいになったね'って\\n初めて言われました」\\n\\n※お客様の許可を得て掲載しています\\n\\n技術を褒められるより\\nお客様の日常が変わった、の一言が\\nsoraにとって一番の宝物です。\\n\\n同じ悩みを抱えてる方、\\nnoteにsoraの想いを書いてます。\",\"ビジュアル指示\":\"1枚目：お客様の声テキストカード\\n（手書き風・柔らかい色味）\\n2枚目：施術After\\n3枚目：DMスクショ（許可済・名前伏せ）\\n4枚目：soraコメントカード\",\"CTA\":\"→ note記事\\n→ DM相談\",\"頻度\":\"月2回\"}", "status": "draft", "memo": ""}, {"id": 117, "sheet_id": 7, "row_number": 3, "col_data": "{\"No.\":\"3\",\"カテゴリ\":\"あるある\\n（参加型）\\n★シリーズ化\",\"投稿テーマ\":\"エクステ気になる人あるある\",\"共感フック\":\"あるあるフレーム\\n\\nリスト形式で共感を重ね\\n「soraもそうだった」で同じ目線に\\n\\n★ブルーオーシャン戦略：\\nエクステあるあるを\\nシリーズ化して先行者に\",\"キャプション テンプレート\":\"【 エクステ気になるけど踏み出せない人あるある 】\\n\\n- IGで「エクステ」検索しまくってる\\n- でも「派手になりそう」が怖い\\n- 周りにエクステの人いなくて聞けない\\n- 美容室に行くこと自体が緊張する\\n- そもそも何本つけたらいいかわからない\\n\\nsoraのお客様も\\n最初はみんなこうでした。\\n\\n初めての方向けにnoteに書きました。\\n「不安」が「楽しみ」に変わるはず。\",\"ビジュアル指示\":\"1枚目：あるあるリストカード\\n2枚目：「soraのお客様は初めてが半分以上」\\n3枚目：初めてのお客様BA事例\\n4枚目：note誘導カード\",\"CTA\":\"→ note記事\\n（初めての方向け）\",\"頻度\":\"月2回\\n★シリーズ化\"}", "status": "draft", "memo": ""}, {"id": 118, "sheet_id": 7, "row_number": 4, "col_data": "{\"No.\":\"4\",\"カテゴリ\":\"人柄・想い\\n（ストーリー型）\",\"投稿テーマ\":\"soraのこだわり\",\"共感フック\":\"変身ストーリーフレーム\\nまたは\\n悩み正当化フレーム\\n\\nsoraの原体験を語る\",\"キャプション テンプレート\":\"【 わたしがエクステにこだわる理由 】\\n\\n「エクステ＝派手」じゃない。\\n\\n髪のボリュームが気になって\\n巻いてもすぐぺたんってなる。\\n朝、鏡を見てテンション下がる。\\n\\nそんな気持ち、soraもわかる。\\n\\nだから「自然に可愛くなれる」\\nエクステを付けたくて、この仕事をしてる。\\n\\n想いをnoteに書きました。\\n読んでもらえたら嬉しいです。\",\"ビジュアル指示\":\"1枚目：施術中の手元カット\\n2-3枚目：想いのテキストカード\\n4枚目：soraの笑顔\\n※共感を呼ぶ「女性の悩み」起点\",\"CTA\":\"→ note記事\\n（soraストーリー）\",\"頻度\":\"月1回\"}", "status": "draft", "memo": ""}, {"id": 119, "sheet_id": 7, "row_number": 5, "col_data": "{\"No.\":\"5\",\"カテゴリ\":\"知識Tips\\n（悩み解決型）\",\"投稿テーマ\":\"エクステQ&A\",\"共感フック\":\"悩み正当化フレーム\\n+\\n問いかけ参加型\\n\\nよくある質問を悩みベースで\",\"キャプション テンプレート\":\"【 エクステ、何本つけたらいいの？ 】\\n\\nこれ、一番聞かれる質問。\\n\\n「何本がいいかわからなくて\\nずっと迷ってました」って人、多い。\\n\\n60本：ちょい足しボリューム\\n80本：自然なロング（一番人気！）\\n100本~：しっかり変化\\n\\n巻いた時の見え方が大事だから\\nnoteに本数別の巻き髪比較載せてます。\",\"ビジュアル指示\":\"1枚目：本数別比較写真\\n2枚目：巻き髪での見え方\\n3枚目：解説テキストカード\\n4枚目：note誘導カード\",\"CTA\":\"→ note記事\\n（本数ガイド）\",\"頻度\":\"月1回\"}", "status": "draft", "memo": ""}, {"id": 120, "sheet_id": 7, "row_number": 6, "col_data": "{\"No.\":\"6\",\"カテゴリ\":\"奈良×世界観\",\"投稿テーマ\":\"奈良で待ってます\",\"共感フック\":\"奈良ローカル\\n×美容フレーム\\n\\n「奈良のこの場所が好き」\\nから始める\",\"キャプション テンプレート\":\"【 新大宮の小さなサロンから 】\\n\\n窓から入る奈良の光が好き。\\n\\nお客様が帰るとき\\n「来てよかった」って笑ってくれる。\\n\\nその笑顔のために\\nsoraは奈良でやってます。\\n\\nsoraのことnoteで知ってもらえたら嬉しいです。\",\"ビジュアル指示\":\"1枚目：サロン内の自然光\\n2枚目：新大宮の街並み\\n3枚目：奈良の季節の風景\\n4枚目：道具フラットレイ\",\"CTA\":\"→ note記事\",\"頻度\":\"月1回\"}", "status": "draft", "memo": ""}, {"id": 121, "sheet_id": 7, "row_number": 7, "col_data": "{\"No.\":\"7\",\"カテゴリ\":\"★保存特化\\n【バズ設計書連動】\",\"投稿テーマ\":\"保存される本数ガイド\",\"共感フック\":\"数字フック\\n+保存誘導\\n\\n「何本がいい？」の\\n疑問に完全回答\\n\\n★バズるコンテンツ設計書\\nの保存率特化フォーマット\",\"キャプション テンプレート\":\"【 保存推奨 】エクステ何本がいい？\\n\\n「何本つけたらいいかわからない」\\nこれ、一番聞かれる質問。\\n\\n60本：ちょい足し自然派\\n80本：一番人気！巻き髪映え\\n100本~：しっかり変化したい人\\n\\n巻いた時と下ろした時で\\n全然印象変わるから\\n4枚目に比較載せてます。\\n\\n保存して美容室で見せてね。\",\"ビジュアル指示\":\"1枚目：3パターン横並び比較\\n2枚目：60本BA\\n3枚目：80本BA\\n4枚目：100本BA\\n5枚目：巻き髪での比較\\n★保存を促すデザインに\",\"CTA\":\"→ note記事\\n（本数ガイド詳細）\",\"頻度\":\"1回（定番）\"}", "status": "draft", "memo": ""}, {"id": 122, "sheet_id": 7, "row_number": 8, "col_data": "{\"No.\":\"8\",\"カテゴリ\":\"★シェア特化\\n【バズ設計書連動】\",\"投稿テーマ\":\"シェアされるNG集\",\"共感フック\":\"禁止フック\\n+シェア誘導\\n\\n「友達にも教えたい」で\\nDMシェアを狙う\\n\\n★バズるコンテンツ設計書\\nのシェア率特化フォーマット\",\"キャプション テンプレート\":\"【 友達にもシェアして 】\\n\\nエクステつける前に知ってほしい\\nNG行動5選。\\n\\n① 安さだけで選ぶ\\n② 施術事例を見ないで予約\\n③ カウンセリングを省略される\\n④ ケア方法を教えてもらわない\\n⑤ 「何でもいいです」と言う\\n\\nsoraに来る前の予習として\\n保存しておいてね。\",\"ビジュアル指示\":\"1枚目：NG5選リストカード（赤系）\\n2枚目-5枚目：各NG解説カード\\n6枚目：soraのカウンセリング風景\\n★「友達にシェアして」を促す\",\"CTA\":\"→ note記事\\n→ DM相談\",\"頻度\":\"月1回\"}", "status": "draft", "memo": ""}, {"id": 123, "sheet_id": 7, "row_number": 9, "col_data": "{\"No.\":\"9\",\"カテゴリ\":\"★参加型クイズ\\n【バズ設計書連動】\",\"投稿テーマ\":\"クイズ どっちがエクステ？\",\"共感フック\":\"クイズ形式\\n+スワイプ誘導\\n\\n参加型で完了率UP\\n「正解は4枚目」で\\nスワイプを促す\\n\\n★バズるコンテンツ設計書\\nのクイズフォーマット\",\"キャプション テンプレート\":\"【 正解率5% 】\\n\\nどっちがエクステでしょう？\\n\\n正解は…4枚目！\\n\\n「バレたくない」\\n「自然がいい」\\n「地毛みたいにしたい」\\n\\n全部叶えます。\\nnoteにこだわりを書いてます。\",\"ビジュアル指示\":\"1枚目：A/B 2パターンの髪写真\\n2枚目：ヒント（角度を変えて）\\n3枚目：「正解は？」カード\\n4枚目：答え＋解説\\n★参加型でスワイプ率UP\",\"CTA\":\"→ note記事\\n（技術のこだわり）\",\"頻度\":\"月1回\"}", "status": "draft", "memo": ""}, {"id": 124, "sheet_id": 8, "row_number": 1, "col_data": "{\"No.\":\"1\",\"カテゴリ\":\"BA変身\",\"リールテーマ\":\"エクステ劇的変身\",\"共感フック（冒頭3秒）\":\"冒頭テロップ：\\n「巻いても夕方にはぺたんこ」\\n「毎朝30分セットしてたのに」\\n\\n※悩みテキストで止まらせる\",\"構成（秒数目安）\":\"0-3秒：悩みテロップ（黒背景）\\n3-5秒：Before（暗めトーン）\\n5-8秒：施術中の手元\\n8-12秒：After（明るく華やか）\\n12-15秒：巻き髪スタイリング\",\"キャプション テンプレート\":\"「夕方にはぺたんこ」が悩みだった方。\\n◯本でこの変化です。\\n\\n同じ悩みの方、noteで詳しく書いてます。\",\"CTA\":\"→ note記事\"}", "status": "draft", "memo": ""}, {"id": 125, "sheet_id": 8, "row_number": 2, "col_data": "{\"No.\":\"2\",\"カテゴリ\":\"★エクステあるある\\nシリーズvol.1\\n【ブルーオーシャン】\",\"リールテーマ\":\"エクステ気になる人\\nあるある5選\",\"共感フック（冒頭3秒）\":\" ます。\",\"CTA\":\"→ note（ケア）\"}", "status": "draft", "memo": ""}, {"id": 129, "sheet_id": 8, "row_number": 6, "col_data": "{\"No.\":\"6\",\"カテゴリ\":\"馴染み検証\",\"リールテーマ\":\"地毛vsエクステ当てクイズ\",\"共感フック（冒頭3秒）\":\"冒頭テロップ：\\n「エクステバレたくない人へ」\\n\\n※不安への解答を予告\",\"構成（秒数目安）\":\"0-3秒：「どっちがエクステ？」\\n3-8秒：2パターン見せ\\n8-12秒：答え合わせ\\n12-15秒：sora笑顔\",\"キャプション テンプレート\":\"「バレたくない」その気持ちわかるから\\n馴染みにこだわってる。\\nnoteに技術のこだわり書いてます。\",\"CTA\":\"→ note（技術）\"}", "status": "draft", "memo": ""}, {"id": 130, "sheet_id": 8, "row_number": 7, "col_data": "{\"No.\":\"7\",\"カテゴリ\":\"vlog風\",\"リールテーマ\":\"奈良の美容師の1日\",\"共感フック（冒頭3秒）\":\"冒頭テロップ：\\n「奈良で美容師してます」\\n\\n※ローカル感で目を引く\\n奈良の景色をインサート\",\"構成（秒数目安）\":\"0-5秒：新大宮の朝の風景\\n5-10秒：サロン準備\\n10-20秒：施術ダイジェスト\\n20-25秒：奈良カフェでひと息\\n25-30秒：帰り道の奈良の景色\",\"キャプション テンプレート\":\"奈良で美容師してます。\\nこの街とこの仕事が好きな理由、\\nnoteで語ってます。\",\"CTA\":\"→ note（ストーリー）\"}", "status": "draft", "memo": ""}, {"id": 131, "sheet_id": 8, "row_number": 8, "col_data": "{\"No.\":\"8\",\"カテゴリ\":\"お客様密着\",\"リールテーマ\":\"初エクステ密着ストーリー\",\"共感フック（冒頭3秒）\":\"冒頭テロップ：\\n「初めてのエクステ、\\n不安で泣きそうだった彼女が」\\n\\n※感情を先に出す\",\"構成（秒数目安）\":\"0-3秒：不安テロップ\\n3-8秒：カウンセリング風景\\n8-15秒：施術タイムラプス\\n15-25秒：After + お客様の表情\\n25-30秒：感想テロップ\",\"キャプション テンプレート\":\"初めてのエクステ、不安だよね。\\nでもsoraが全部一緒に考えるから。\\nnoteにカウンセリングのこと書いてます。\",\"CTA\":\"→ note（カウンセリング）\"}", "status": "draft", "memo": ""}, {"id": 132, "sheet_id": 8, "row_number": 9, "col_data": "{\"No.\":\"9\",\"カテゴリ\":\"★JKターゲット\\n卒業シーズン\",\"リールテーマ\":\"卒業したら即イメチェン\",\"共感フック（冒頭3秒）\":\"冒頭テロップ：\\n「3年間我慢した髪を\\n解放する日が来た」\\n\\n※卒業シーズンの高揚感で\\n手を止める\\n校則→自由の対比で共感\",\"構成（秒数目安）\":\"0-3秒：「3年間我慢した髪を解放」テロップ\\n3-5秒：Before（黒髪ストレート・制服風）\\n5-8秒：soraとのカウンセリング風景\\n（「どうしたい？」「ずっと憧れてた髪に」）\\n8-12秒：施術中（カラー+エクステ装着）\\n12-18秒：After（カラー+エクステで華やか）\\n（笑顔で髪を触る）\\n18-22秒：友達のリアクション風テロップ\\n「誰！？別人やん！」\\n22-25秒：「soraは卒業の味方」テロップ\\n+note誘導\",\"キャプション テンプレート\":\"3年間、校則で我慢してた髪。\\n卒業式が終わったその日に来てくれました。\\n\\n「ずっとこうなりたかった」\\nって笑ってくれた顔が忘れられない。\\n\\n卒業したらsoraに会いに来てね。\\nnoteに卒業イメチェンガイド書いてます。\\n\\n#卒業ヘア #イメチェン #垢抜け\\n#奈良エクステ #soraのエクステ\\n#高校卒業 #奈良JK\",\"CTA\":\"→ note記事\\n（卒業イメチェンガイド）\"}", "status": "draft", "memo": ""}, {"id": 133, "sheet_id": 8, "row_number": 10, "col_data": "{\"No.\":\"10\",\"カテゴリ\":\"★JDターゲット\\n大学デビュー\",\"リールテーマ\":\"大学デビュー\\n垢抜けビフォーアフター\",\"共感フック（冒頭3秒）\":\"冒頭テロップ：\\n「入学式までに別人になる」\\n\\n※大学デビューの高揚感\\n「高校時代と違う自分」への\\n期待をフックに\",\"構成（秒数目安）\":\"0-3秒：「入学式までに別人に」テロップ\\n3-5秒：Before（高校生風・黒髪ナチュラル）\\n5-8秒：soraとのカウンセリング\\n（「どんな自分になりたい？」）\\n8-10秒：カラーチャート選び\\n10-14秒：施術中（カラー+エクステ装着）\\n14-18秒：After（エフォートレスヘア完成）\\n（鏡を見て嬉しそうな表情）\\n18-22秒：「高校の時と全然違う！」テロップ\\n22-25秒：「soraと新しい自分、作ろう」\\n+note誘導\",\"キャプション テンプレート\":\"「高校の時と全然違う人になりたい」\\n\\n大学デビューを本気で考えてた子が\\n入学式前に来てくれました。\\n\\n2026年は「エフォートレス」がトレンド。\\n頑張りすぎてない、でもおしゃれ。\\nsoraと一緒に作った新しい自分。\\n\\nnoteに大学デビューガイド書いてます。\\n\\n#大学デビュー #垢抜け #イメチェン\\n#奈良エクステ #soraのエクステ\\n#入学式 #春ヘア\",\"CTA\":\"→ note記事\\n（大学デビューガイド）\"}", "status": "draft", "memo": ""}, {"id": 134, "sheet_id": 8, "row_number": 11, "col_data": "{\"No.\":\"11\",\"カテゴリ\":\"★3秒変身チャレンジ\\n【バズ設計書連動】\",\"リールテーマ\":\"3秒変身チャレンジ\",\"共感フック（冒頭3秒）\":\"冒頭：Before暗い→\\n手で隠す→\\nパッとAfter華やか\\n\\n★最もバズりやすいBA形式\\n衝撃結果先出しフック\\nループ構造で再生率UP\",\"構成（秒数目安）\":\"0-1秒：Before（暗めトーン・ぺたんこ髪）\\n1-3秒：soraの手で髪を隠す\\n3秒：パッとAfter華やかな巻き髪ドン\\n（BGMのドロップに合わせる）\\n3-15秒：ループ再生\\n★計15秒のループ構造\",\"キャプション テンプレート\":\"この変化、本当に2時間。\\n保存して美容室で見せてね。\\n\\n#エクステ変身 #BA #ビフォーアフター\\n#奈良エクステ #soraのエクステ\",\"CTA\":\"→ note記事\\n→ DM相談\"}", "status": "draft", "memo": ""}, {"id": 135, "sheet_id": 8, "row_number": 12, "col_data": "{\"No.\":\"12\",\"カテゴリ\":\"★一般人vs美容師\\n【バズ設計書連動】\",\"リールテーマ\":\"一般人vs美容師の巻き方\",\"共感フック（冒頭3秒）\":\"冒頭：画面分割で\\n「一般人の巻き方/\\n美容師の巻き方」\\n\\n★対比フック\\n「友達に見せたい」で\\nDMシェア率が高い\",\"構成（秒数目安）\":\"0-3秒：画面分割で\\n「一般人の巻き方/美容師の巻き方」\\n3-15秒：同じコテでの実演対比\\n（持ち方・角度・巻く方向の違い）\\n15-20秒：コツ解説テロップ\\n★教育系×エンタメで保存率UP\",\"キャプション テンプレート\":\"同じ32mmコテでもこんなに違う。\\n巻き方のコツ、noteで詳しく。\\n\\n#巻き方 #コテ巻き #美容師テク\\n#奈良エクステ #soraのエクステ\",\"CTA\":\"→ note記事\\n（巻き方ガイド）\"}", "status": "draft", "memo": ""}, {"id": 136, "sheet_id": 8, "row_number": 13, "col_data": "{\"No.\":\"13\",\"カテゴリ\":\"★24時間キープ検証\\n【バズ設計書連動】\",\"リールテーマ\":\"24時間キープ検証\",\"共感フック（冒頭3秒）\":\"冒頭テロップ：\\n「本当に24時間持つ？」\\n\\n★検証系は保存率が高い\\n実証データ＝信頼構築\\nタイムラプスで視覚的に\",\"構成（秒数目安）\":\"0-3秒：「本当に24時間持つ？」テロップ\\n3-8秒：朝セット完了\\n8-12秒：昼（通勤・仕事中）\\n12-16秒：夜（帰宅後）\\n16-20秒：翌朝のスタイル\\n20-25秒：「持ちました！」テロップ\\n★タイムラプスで4カット\",\"キャプション テンプレート\":\"エクステの巻きが24時間持つか検証。\\n結果…noteで詳しく。\\n\\n#エクステ検証 #巻き髪キープ\\n#奈良エクステ #soraのエクステ\",\"CTA\":\"→ note記事\\n（ケアガイド）\"}", "status": "draft", "memo": ""}, {"id": 137, "sheet_id": 8, "row_number": 14, "col_data": "{\"No.\":\"14\",\"カテゴリ\":\"★逆再生マジック\\n【バズ設計書連動】\",\"リールテーマ\":\"逆再生マジック\",\"共感フック（冒頭3秒）\":\"冒頭：完成形の\\n美しい巻き髪から始まる\\n\\n★意外性＋エンタメ\\nループ再生で\\n「え、何これ」と手が止まる\",\"構成（秒数目安）\":\"0-3秒：完成形の巻き髪（美しいAfter）\\n3-10秒：逆再生でエクステを外していく\\n10-15秒：最後にBefore（ぺたんこ髪）\\n15秒：テロップ\\n「これが現実。でもsoraが変えます」\\n★逆再生＋ループ構造\",\"キャプション テンプレート\":\"逆再生したら現実に戻った。笑\\nでも大丈夫、soraがいるから。\\n\\n#エクステ #逆再生 #マジック\\n#奈良エクステ #soraのエクステ\",\"CTA\":\"→ note記事\\n→ DM相談\"}", "status": "draft", "memo": ""}, {"id": 138, "sheet_id": 9, "row_number": 1, "col_data": "{\"No.\":\"1\",\"カテゴリ\":\"施術実況\",\"テーマ\":\"施術チラ見せ\",\"構成\":\"1枚目：Before\\n2枚目：施術中動画\\n3枚目：After+アンケート\",\"テキスト/スタンプ\":\"「今日のお客様 ◯本エクステ」\\nアンケート：「何本だと思う？」\\n最後にnoteリンクスタンプ\",\"CTA\":\"→ note\\n→ DM相談\",\"タイミング\":\"施術日\"}", "status": "draft", "memo": ""}, {"id": 139, "sheet_id": 9, "row_number": 2, "col_data": "{\"No.\":\"2\",\"カテゴリ\":\"空き枠告知\",\"テーマ\":\"今週の空き状況\",\"構成\":\"1枚目：カレンダー画像\\n2枚目：DM誘導\",\"テキスト/スタンプ\":\"「◯日 ◯時~ 空きあります」\\nDMスタンプ\\n「お気軽にどうぞ」\",\"CTA\":\"→ DM予約\",\"タイミング\":\"月曜\"}", "status": "draft", "memo": ""}, {"id": 140, "sheet_id": 9, "row_number": 3, "col_data": "{\"No.\":\"3\",\"カテゴリ\":\"アンケート\\n（参加型）\",\"テーマ\":\"投票で巻き込む\",\"構成\":\"1枚目：2択アンケート\\n2枚目：結果シェア予告\",\"テキスト/スタンプ\":\"「エクステ60本vs80本、どっちが好み？」\\n「奈良のカフェ、◯◯vs△△」\\n結果はThreadsでシェア\\n\\n★@nara_select式CTA応用：\\n「気になったら〇ってコメント！」\",\"CTA\":\"→ Threads\\nで結果報告\",\"タイミング\":\"週1-2回\"}", "status": "draft", "memo": ""}, {"id": 141, "sheet_id": 9, "row_number": 4, "col_data": "{\"No.\":\"4\",\"カテゴリ\":\"お客様の声\",\"テーマ\":\"DM紹介（許可済）\",\"構成\":\"1枚目：DMスクショ（名前伏せ）\\n2枚目：soraのコメント\\n3枚目：同じ悩みの人へ\",\"テキスト/スタンプ\":\"「嬉しいDMもらいました」\\n「こういう声がsoraの原動力」\\n「同じ悩みの方、気軽にDMしてね」\",\"CTA\":\"→ DM相談\\n→ note\",\"タイミング\":\"DM受信時\"}", "status": "draft", "memo": ""}, {"id": 142, "sheet_id": 9, "row_number": 5, "col_data": "{\"No.\":\"5\",\"カテゴリ\":\"奈良の日常\",\"テーマ\":\"soraの奈良暮らし\",\"構成\":\"1-3枚目：カフェ・景色・鹿\",\"テキスト/スタンプ\":\"「新大宮のお気に入りランチ」\\n「奈良公園の鹿に癒された」\\n位置情報スタンプ\\n「Threadsでも奈良のこと発信中」\",\"CTA\":\"→ Threads\\nフォロー誘導\",\"タイミング\":\"休日\"}", "status": "draft", "memo": ""}, {"id": 143, "sheet_id": 9, "row_number": 6, "col_data": "{\"No.\":\"6\",\"カテゴリ\":\"note誘導\",\"テーマ\":\"新記事UP告知\",\"構成\":\"1枚目：記事タイトルカード\\n2枚目：見どころ\\n3枚目：リンクスタンプ\",\"テキスト/スタンプ\":\"「新しいnote書きました」\\n「◯◯について語ってます」\\nリンクスタンプ\",\"CTA\":\"→ note直接リンク\",\"タイミング\":\"更新時\"}", "status": "draft", "memo": ""}, {"id": 144, "sheet_id": 10, "row_number": 1, "col_data": "{\"No.\":\"1\",\"カテゴリ\":\"奈良あるある\",\"テーマ\":\"奈良県民あるある\",\"共感フレーム\":\"あるあるフレーム\\n\\nリプライを誘う問いかけ\",\"投稿テンプレート\":\"奈良あるある言いたい。\\n\\n「奈良って何もないよね」\\n言われるたびに\\n「いや、あるねん…」ってなる。\\n\\n・鹿せんべい買ったことない\\n・大阪まで30分が最大のメリット\\n・イオンモール大和郡山の安心感\\n・でもなんだかんだ奈良が好き\\n\\n奈良民のみんな、あるある教えて。\",\"奈良ローカル要素\":\"鹿との日常\\n「大阪まで30分」問題\\n若草山の山焼き見る見ない\\nイオンモール大和郡山\\n奈良公園の通勤路\",\"他者連携\":\"奈良系アカウントの投稿に\\n共感リプライ\\n\\n@watashiha_narahaなど\\nの投稿を引用リポスト\",\"頻度\":\"週2回\"}", "status": "draft", "memo": ""}, {"id": 145, "sheet_id": 10, "row_number": 2, "col_data": "{\"No.\":\"2\",\"カテゴリ\":\"奈良カフェ\\n★クロスエンゲージ\",\"テーマ\":\"奈良の推しカフェ\",\"共感フレーム\":\"問いかけ参加型\\n\\n「おすすめ教えて」で\\nリプを誘う\\n\\n★@nara_lunch_cafe式\\nCTAを参考に\",\"投稿テンプレート\":\"新大宮の◯◯ってカフェ知ってる？\\n\\nここのスコーン、ほんまに美味しくて\\n施術の合間にこっそり買いに行く。笑\\n\\nひとりでも入りやすいし\\n窓際の席が最高。\\n\\n行ったことある人は〇って教えて！\\nおすすめのカフェも知りたい~\",\"奈良ローカル要素\":\"新大宮周辺のカフェ\\nならまちの雑貨屋併設カフェ\\n学園前のパン屋\\n富雄のランチ\\n※soraが実際に行った店だけ\",\"他者連携\":\"★@nara_lunch_cafe（43K IG/\\n6,848 Threads）の投稿を\\n引用リポストで\\n「ここ私も好き！」\\n→奈良カフェクラスタからの流入\",\"頻度\":\"週1-2回\"}", "status": "draft", "memo": ""}, {"id": 146, "sheet_id": 10, "row_number": 3, "col_data": "{\"No.\":\"3\",\"カテゴリ\":\"奈良季節ネタ\",\"テーマ\":\"奈良の四季とヘア\",\"共感フレーム\":\"奈良ローカル\\n×美容フレーム\\n\\n季節→髪の悩み→解決\",\"投稿テンプレート\":\"奈良の梅雨、髪の毛の敵すぎん？\\n\\n朝セットしても\\n家出て5分でアウトなんやけど。笑\\n\\n新大宮の駅着く頃には\\nもうぺたんこ。\\n\\n同じ悩みの奈良女子、\\nsoraは味方やで。\\n\\n湿気対策noteに書いたから見てー。\",\"奈良ローカル要素\":\"梅雨の湿気×髪うねり\\n夏の紫外線×髪ダメージ\\n秋の乾燥×パサつき\\n冬の静電気×広がり\\n+奈良イベント（燈花会等）\",\"他者連携\":\"季節ネタは他の奈良アカウントと\\n共通話題になりやすい\\n相互リプの起点にする\",\"頻度\":\"月2-3回\"}", "status": "draft", "memo": ""}, {"id": 147, "sheet_id": 10, "row_number": 4, "col_data": "{\"No.\":\"4\",\"カテゴリ\":\"女性の本音\",\"テーマ\":\"髪の悩み、言えない\",\"共感フレーム\":\"悩み正当化フレーム\\n\\n「人に言いにくい」を\\n受け止める\",\"投稿テンプレート\":\"髪のボリュームが減ってきた気がする。\\n\\nこれ、20代後半から\\nじわじわ感じる人多いと思う。\\n\\n人に言いにくいよね。\\n美容室で相談するのも恥ずかしいし。\\n\\nでもsoraにはなんでも話して。\\n女同士やし。\\n\\nこの悩みとの向き合い方\\nnoteに本音で書いてます。\",\"奈良ローカル要素\":\"「奈良は風強い日多いから\\n余計に気になるよね」\\nのように地域ネタを添える\",\"他者連携\":\"同じ悩みを持つ\\nフォロワーのリプに丁寧に返信\\n→コミュニティ感を作る\",\"頻度\":\"週1回\"}", "status": "draft", "memo": ""}, {"id": 148, "sheet_id": 10, "row_number": 5, "col_data": "{\"No.\":\"5\",\"カテゴリ\":\"★エクステあるある\\n【Threads版】\",\"テーマ\":\"エクステの本音あるある\",\"共感フレーム\":\"あるあるフレーム\\n\\n★ブルーオーシャン！\\nThreadsでエクステ共感系を\\n出しているアカウントは\\n現時点でほぼゼロ\\n\\n先に取れば独壇場に\",\"投稿テンプレート\":\"エクステつけてる人にしかわからない\\nあるある言いたい。\\n\\n・シャンプーが前より丁寧になった\\n・風強い日ちょっと心配になる\\n・「それエクステ？」って聞かれると嬉しい\\n・朝の準備が爆速になった\\n・鏡見る回数が確実に増えた\\n\\nわかる人いたら教えて。笑\\n\\nちなみにケアのコツ、noteに書いてるよ。\",\"奈良ローカル要素\":\"「奈良の風の日、\\nエクステ民にはちょっと怖い。笑」\\nなど奈良ネタと掛け合わせる\",\"他者連携\":\"エクステに興味ある人の\\nリプに積極的に返信\\n→DM相談への自然な流れ\\n\\nIGリールのあるある\\nシリーズと連動配信\",\"頻度\":\"月2回\\n（IGリールと連動）\"}", "status": "draft", "memo": ""}, {"id": 149, "sheet_id": 10, "row_number": 6, "col_data": "{\"No.\":\"6\",\"カテゴリ\":\"お客様こぼれ話\",\"テーマ\":\"IGの裏側ストーリー\",\"共感フレーム\":\"B→I→Aフレーム\\n+\\nお客様リポスト\\n\\n感動エピソードで共感\",\"投稿テンプレート\":\"さっきIGに上げたBefore/After。\\nあの子、実は初エクステで。\\n\\n最初めっちゃ不安そうやったのに\\n仕上がり見た瞬間\\n鏡の前でずっと髪触ってくれて。\\n\\n「明日会社行くの楽しみ」って。\\n\\nこういう言葉が聞けるから\\nsoraは新大宮でやってる。\\n\\n施術の詳細はnoteに書いてます。\",\"奈良ローカル要素\":\"「新大宮で待ってる」\\n「奈良まで来てくれてありがとう」\\nの一言を必ず添える\",\"他者連携\":\"IG投稿と同日配信\\nお客様が投稿してくれたら\\nリプで感謝+引用リポスト\",\"頻度\":\"IG投稿と連動\"}", "status": "draft", "memo": ""}, {"id": 150, "sheet_id": 10, "row_number": 7, "col_data": "{\"No.\":\"7\",\"カテゴリ\":\"soraの日常\",\"テーマ\":\"美容師の休日\",\"共感フレーム\":\"等身大フレーム\\n\\n「美容師のオフ」への\\n親近感\",\"投稿テンプレート\":\"休みの日、何してるか聞かれるけど\\n正直に言うと\\n\\n奈良をうろうろしてる。笑\\n\\nならまちでランチして\\n雑貨屋さん覗いて\\nコーヒー買って帰る。\\n\\nザ・奈良の休日。\\nこういう暮らしが好き。\",\"奈良ローカル要素\":\"ならまち散策\\n新大宮~奈良駅の徒歩圏\\n奈良公園の鹿\\n「奈良でのんびり」の空気感\",\"他者連携\":\"奈良カフェアカウントの投稿を\\n引用して「ここ行ってきた！」\\n日常系は営業感ゼロを徹底\",\"頻度\":\"週1回\"}", "status": "draft", "memo": ""}, {"id": 151, "sheet_id": 10, "row_number": 8, "col_data": "{\"No.\":\"8\",\"カテゴリ\":\"想い・価値観\",\"テーマ\":\"soraが大事にしてること\",\"共感フレーム\":\"変身ストーリー\\nフレーム\\n\\nsoraの原体験を語る\",\"投稿テンプレート\":\"「また来たい」って思ってもらえる\\nサロンって何やろう。\\n\\n技術はもちろんやけど\\nsoraは「話しやすかった」って\\n言ってもらえるのが一番嬉しい。\\n\\n女性のお客様が多いから\\n「こうなりたい」をちゃんと聴く。\\nそこからがsoraの仕事。\\n\\nこの話、noteで深掘りしてます。\",\"奈良ローカル要素\":\"「奈良で待ってるよ」の一言\",\"他者連携\":\"深い話はnoteで展開\\nThreadsは入口・きっかけ\",\"頻度\":\"月2回\"}", "status": "draft", "memo": ""}, {"id": 152, "sheet_id": 10, "row_number": 9, "col_data": "{\"No.\":\"9\",\"カテゴリ\":\"奈良イベント\\n★CTA強化\",\"テーマ\":\"季節行事×ヘア提案\",\"共感フレーム\":\"奈良ローカル\\n×問いかけ参加型\\n\\n★@nara_select式CTA：\\n「行きたいと思ったら\\n〇ってコメントしてね！」\\nを活用する\",\"投稿テンプレート\":\"来週なら燈花会やん。\\n\\nキャンドルの中歩くの好きすぎて\\n毎年行ってる。\\n\\n浴衣に合う髪にしたいなぁ。\\nアップにしたいけどボリューム欲しい。\\n\\nイベント前にエクステ、\\nけっこうおすすめです。\\n\\n行く予定の人、〇って教えて！\",\"奈良ローカル要素\":\"燈花会・若草山山焼き\\n東大寺お水取り・鹿の角きり\\n春日大社万灯籠・正倉院展\\n奈良マラソン\\n※奈良の人しか知らない行事感\",\"他者連携\":\"★イベント系投稿は\\n@nara_selectなどの\\n奈良メディアアカウントと\\n相互リプの絶好のチャンス\\n\\n同じイベントの投稿を見つけて\\n引用リポスト→認知拡大\",\"頻度\":\"イベント前\"}", "status": "draft", "memo": ""}, {"id": 153, "sheet_id": 10, "row_number": 10, "col_data": "{\"No.\":\"10\",\"カテゴリ\":\"他者投稿リアクション\\n★最速認知戦略\",\"テーマ\":\"共感リポスト\",\"共感フレーム\":\"他者の投稿を引用し\\nsoraの体験を添える\\n\\n営業感ゼロ\\n人柄を見せる場\\n\\n★これが認知拡大の\\nメインエンジン\",\"投稿テンプレート\":\"（引用リポスト テンプレ）\\n\\nパターンA：@nara_select投稿に対して\\nここ行ったことある！\\n新大宮から近くてお気に入り。\\n奈良の穴場って最高よな。\\n\\nパターンB：@nara_lunch_cafe投稿に対して\\nこのお店気になってた！\\n休みの日に行ってみよ。\\n奈良のカフェレベル高いわ。\\n\\nパターンC：奈良あるある系\\n奈良民として共感しかない。笑\\nこれ県外の人に説明しても伝わらんよね。\",\"奈良ローカル要素\":\"奈良系アカウントの投稿を中心に\\n美容系・ライフスタイル系も\\n\\n引用元のフォロワーに\\nsoraを認知してもらう\",\"他者連携\":\"★重点攻略アカウント：\\n@nara_select（110K IG/12K Th）\\n@nara_lunch_cafe（43K IG/6.8K Th）\\n@watashiha_naraha（71K IG）\\n\\nこれらのフォロワー層が\\nsoraのターゲットと完全一致\",\"頻度\":\"週2-3回\"}", "status": "draft", "memo": ""}, {"id": 154, "sheet_id": 10, "row_number": 11, "col_data": "{\"No.\":\"11\",\"カテゴリ\":\"★奈良JKあるある\\n【NEW】\",\"テーマ\":\"奈良のJKあるある\",\"共感フレーム\":\"あるあるフレーム\\n+奈良ローカル\\n\\n学校生活×奈良の\\nリアルあるあるで\\nJKの共感を取る\\n\\nsoraを「地元のお姉さん」\\nポジションに\",\"投稿テンプレート\":\"奈良のJKあるある、言いたい。\\n\\n・校則で髪染められへんから\\n卒業したら絶対染めるリスト作ってる\\n・待ち合わせは行基さん前\\n・放課後はとりあえずミ・ナーラ\\n・プリクラ→ラウンドワン→フードコートの\\n黄金コース\\n・遊ぶのは大阪やけど\\n帰ってきたら「やっぱ奈良やな」ってなる\\n\\nわかる人、おる？笑\\n\\nsoraも奈良大好きやから\\nこの気持ちめっちゃわかるねん。\\n\\n卒業したら髪の相談乗るから\\nいつでもDMしてな。\",\"奈良ローカル要素\":\"行基さん前の待ち合わせ\\nミ・ナーラの放課後\\n大阪に遊びに行って\\n帰ってくると安心する奈良\\n校則→卒業→美容室の流れ\",\"他者連携\":\"奈良の学生系アカウントや\\n奈良あるあるの投稿にリプ\\n\\nJK/JDフォロワーとの\\n接点を自然に作る\\n\\n営業感ゼロ、\\n「面白いお姉さん」として認知\",\"頻度\":\"月1-2回\"}", "status": "draft", "memo": ""}, {"id": 155, "sheet_id": 10, "row_number": 12, "col_data": "{\"No.\":\"12\",\"カテゴリ\":\"★大学デビューの話\\n【NEW】\",\"テーマ\":\"soraが垢抜けのお手伝い\",\"共感フレーム\":\"悩み正当化\\n+変身ストーリー\\n\\n「大学で変わりたい」\\nJDの気持ちに寄り添う\\n\\nsoraの過去のお客様\\nエピソードで信頼構築\",\"投稿テンプレート\":\"「大学入ったら絶対垢抜ける」\\nって決めてた子が来てくれた話。\\n\\n高校3年間、校則守って\\nずっと黒髪ストレートやったらしい。\\n\\n「入学式までに変わりたいんです」\\nって、目がめっちゃ真剣で。\\n\\nsoraと一緒に「なりたい自分」を\\n2時間かけて作った。\\n\\n仕上がり見た瞬間\\n「これが私…？」って泣いてて\\nsoraも泣きそうやった。\\n\\n大学デビューで変わりたい子、\\nsoraが全力で応援するから。\\n気軽にDMしてね。\",\"奈良ローカル要素\":\"奈良女子大の入学シーズン\\n大学デビューの不安と期待\\n\\n「奈良で垢抜けられるの？」\\n→「soraがおるから大丈夫」\",\"他者連携\":\"大学新入生アカウントや\\n奈良女子大関連の投稿にリプ\\n\\n入学シーズン（2-4月）に\\n集中的に配信\\n\\nnote「大学デビューガイド」\\nへの誘導\",\"頻度\":\"2-4月に集中\\n月2回\"}", "status": "draft", "memo": ""}, {"id": 156, "sheet_id": 10, "row_number": 13, "col_data": "{\"No.\":\"13\",\"カテゴリ\":\"★〇〇な人だけいいねして\\n【バズ設計書連動】\",\"テーマ\":\"行動喚起型エンゲージ\",\"共感フレーム\":\"共感テーマ＋\\n「いいね」で\\nリアクションを求める\\n\\n★行動喚起が簡単\\n（いいねだけ）で\\nエンゲージ率爆増\",\"投稿テンプレート\":\"エクステ気になってるけど\\n踏み出せない人だけいいねして。\\n\\nsoraのお客様、最初はみんなそうだった。\\n踏み出した人は全員\\n「もっと早くやればよかった」って言う。\\n\\nDMで相談だけでも大丈夫やで。\",\"奈良ローカル要素\":\"奈良でエクステ気になってる子\\n近鉄沿線で通える距離\",\"他者連携\":\"エクステ興味ある人のリプに\\n積極的に返信\\n→DM相談への自然な流れ\",\"頻度\":\"月1-2回\"}", "status": "draft", "memo": ""}, {"id": 157, "sheet_id": 10, "row_number": 14, "col_data": "{\"No.\":\"14\",\"カテゴリ\":\"★美容師の本音\\n【バズ設計書連動】\",\"テーマ\":\"美容師が正直に言いたいこと\",\"共感フレーム\":\"告白フック＋共感\\n\\n美容師の本音を\\nさらけ出す\\n\\n★美容師アカウント以外にも\\n拡散されやすい\",\"投稿テンプレート\":\"美容師が正直に言いたいこと。\\n\\n・「何でもいいです」が一番困る\\n・参考画像あると本気出せる\\n・実は「似合う」と「やりたい」のバランスが大事\\n・エクステつけるかは最初から決めなくていい\\n\\nsoraは全部聴くから、なんでも話してね。\",\"奈良ローカル要素\":\"「奈良で待ってる」の一言を添える\\n新大宮のサロンでの実体験ベース\",\"他者連携\":\"美容師アカウントにも\\n拡散されるフォーマット\\n\\n業界あるあるとして\\n共感リプが集まりやすい\",\"頻度\":\"月1回\"}", "status": "draft", "memo": ""}, {"id": 158, "sheet_id": 10, "row_number": 15, "col_data": "{\"No.\":\"15\",\"カテゴリ\":\"★奈良ポエム\\n【バズ設計書連動】\",\"テーマ\":\"奈良で暮らしてて思うこと\",\"共感フレーム\":\"ローカル×哲学的\\nポエム風\\n\\n★奈良好きに\\nリポストされやすい\\n\\n地域愛でフォロー率UP\",\"投稿テンプレート\":\"奈良って、急がない街やなって思う。\\n\\n大阪みたいにせかせかしてないし\\n京都みたいに気取ってない。\\n\\nのんびり鹿が歩いてて\\nみんなちょっと優しい。\\n\\nsoraが奈良でサロンやってる理由、\\nたぶんこれ。\",\"奈良ローカル要素\":\"奈良の空気感\\n大阪・京都との対比\\n鹿のいる日常\\n新大宮の穏やかさ\",\"他者連携\":\"奈良系アカウントの投稿に\\n共感リプ\\n\\n奈良好きのフォロワーから\\nリポストされやすい\",\"頻度\":\"月1回\"}", "status": "draft", "memo": ""}, {"id": 159, "sheet_id": 10, "row_number": 16, "col_data": "{\"No.\":\"16\",\"カテゴリ\":\"★美容室選び教育\\n【バズ設計書連動】\",\"テーマ\":\"エクステで失敗しない美容室の選び方\",\"共感フレーム\":\"禁止フック＋教育\\n\\nネガティブ情報で注目→\\nsoraとの対比\\n\\n★「友達に教えたい」で\\nシェア率が高い\",\"投稿テンプレート\":\"エクステで失敗しない美容室の選び方。\\n\\n・カウンセリングが5分以下→危険\\n・「何本でも同じ」って言う→危険\\n・Before/Afterを見せてくれない→危険\\n・地毛との馴染み方を説明しない→危険\\n\\nsoraは最低30分カウンセリングする。\\nそこが一番大事やと思ってるから。\",\"奈良ローカル要素\":\"奈良のサロン選びの参考に\\n新大宮でのsoraの実体験ベース\",\"他者連携\":\"「友達に教えたい」で\\nDMシェアされやすい\\n\\n教育コンテンツとして\\n保存もされる\",\"頻度\":\"月1回\"}", "status": "draft", "memo": ""}, {"id": 160, "sheet_id": 11, "row_number": 1, "col_data": "{\"No.\":\"1\",\"カテゴリ\":\"施術解説\",\"記事タイトル案\":\"6Dエクステで「地毛みたい」を叶える、奈良の美容師soraのこだわり\",\"構成テンプレート\":\"■ 導入：「エクステ=バレる 5-7回/週\",\"note\":\"2回/月\"}", "status": "draft", "memo": ""}, {"id": 187, "sheet_id": 13, "row_number": 10, "col_data": "{\"曜日\":\"リサーチに基づく戦略サマリー\"}", "status": "draft", "memo": ""}, {"id": 188, "sheet_id": 13, "row_number": 11, "col_data": "{\"曜日\":\"【ブルーオーシャン戦略】「エクステあるある」コンテンツはIG/Threads共に未開拓。リール+Threads連動でシリーズ化し、第一人者ポジションを確立する。\\n【差別化】@ivan_liz_（1,317F/1,401投稿）は量で攻めている。soraは1投稿の質（悩みストーリー+共感フック+note誘導）で圧倒する。@mrrk__oro（1,976F/37投稿）のように写真の質だけで伸ばせる証明もある。\\n【最速認知ルート】@nara_select（110K）・@nara_lunch_cafe（43K）のThreadsに引用リポスト＋リプで「奈良好きの美容師」として認知を取る。これが0→1000フォロワーの最短ルート。\\n【共感設計】悩みの正当化→他者の声→営業感ゼロの3原則を全投稿に徹底。Threadsでは「奈良に住んでる美容師の女の子の日常」として見てもらう。\\n【note連携】すべてのコンテンツの最終着地点をnoteに設定。「書いたよ~」の軽さで誘導し、noteで信頼を構築→予約に繋げる。\"}", "status": "draft", "memo": ""}, {"id": 189, "sheet_id": 13, "row_number": 13, "col_data": "{\"曜日\":\"★ JK・JDターゲット 月次コンテンツ施策（v5追加）\"}", "status": "draft", "memo": ""}, {"id": 190, "sheet_id": 13, "row_number": 14, "col_data": "{\"曜日\":\"【月1回】JK/JD向け共感コンテンツを各プラットフォームで配信する。\\n\\n■ IG リール：月1本のJK/JDターゲットリール（卒業イメチェン、大学デビューBA等）\\n■ Threads：月1-2回の奈良JKあるある or 大学デビューネタ投稿\\n■ note：シーズン集中配信（2-4月：卒業→入学 / 8-9月：文化祭 / 10-1月：成人式）\\n\\n【季節別重点テーマ】\\n2-3月：卒業→即イメチェン。「3年間我慢した髪を解放」がメインメッセージ。\\n3-4月：大学デビュー垢抜け。入学式までに変わりたい子をキャッチ。\\n6-8月：文化祭準備×夏のヘアケア。校則内で最大限可愛くする提案。\\n8月：なら燈花会×浴衣ヘアアレンジ。JK/JDの夏イベントに寄り添う。\\n10-1月：成人式ヘア準備。振袖×エクステの提案を早めに配信。\\n\\n【目的】soraを「奈良のJK/JDが卒業後・大学デビューで頼る美容師」として認知させる。\\n高校在学中からIGをフォローしてもらい、卒業後に来店してもらう長期育成戦略。\"}", "status": "draft", "memo": ""}, {"id": 191, "sheet_id": 13, "row_number": 16, "col_data": "{\"曜日\":\"★ バズ狙い投稿 運用ガイド（v6追加）\"}", "status": "draft", "memo": ""}, {"id": 192, "sheet_id": 13, "row_number": 17, "col_data": "{\"曜日\":\"【水曜リール = バズフォーマット】水曜日のリール枠は「バズるコンテンツ設計書」のフォーマットを優先的に使う。\\n隔週で「エクステあるある」と「バズフォーマット（3秒変身/vs美容師/24時間検証/逆再生）」を交互に投稿する。\\n\\n【月1回バズチャレンジDAY】毎月第3水曜日を「バズチャレンジDAY」に設定。\\nその日はリール＋Threads＋フィードの3プラットフォーム同時投稿で最大リーチを狙う。\\n\\n■ バズチャレンジDAYの投稿セット例：\\n・リール：3秒変身チャレンジ or 一般人vs美容師\\n・Threads：「〇〇な人だけいいねして」or「美容師が正直に言いたいこと」\\n・フィード：保存される本数ガイド or シェアされるNG集\\n\\n【バズ指標の追跡】毎週月曜にインサイトを確認し、以下を記録する：\\n・DMシェア率（目標：全インタラクションの25%以上）\\n・保存率（目標：2-3%以上）\\n・再生完了率（目標：40-60%）\\n・冒頭3秒離脱率（目標：45%以下）\\n\\n【PDCAサイクル】バズったコンテンツの要素を分析し、次月のバズチャレンジに反映する。\\nバズらなかったコンテンツは「フック」「構成」「CTA」のどこに問題があったかを振り返る。\"}", "status": "draft", "memo": ""}]};
const STORAGE_KEY='sora-v2';
const SKIP_FIELDS=new Set(['No.','STEP','目標値','指標','KPI','頻度','重要度','期待効果','役割','プラットフォーム','曜日','タイミング','季節/タイミング','参考（伸びてるアカウントの傾向）','使えるシーン','soraの対策','次STEPへの誘導','関連ハッシュタグ','連携元','他者連携','構造']);
const SHOW_FIELDS=['テーマ','投稿テーマ','リールテーマ','記事タイトル案','フレーム名','施策名','ネタ','フォーマット名','フックパターン','投稿テンプレート','キャプション テンプレート','構成テンプレート','Threads投稿テンプレ','IG投稿テンプレ','投稿テンプレート（リポスト時）','共感フック','共感フック（冒頭3秒）','構成','構成（秒数目安）','コンテンツ例','ビジュアル指示','テキスト/スタンプ','CTA','投稿での使い方例','共感フレーム','具体的なやり方','注意点','備考','IG用テンプレ例','Threads用テンプレ例','IG フィード','IG リール','IG ストーリーズ','Threads','note','カテゴリ','ターゲット','オリジナルタグ','大タグ（10万+）','中タグ（1万-10万）','小タグ~1万（狙い目）','奈良ローカル要素','文字数'];
const SHEET_NAMES={};
SEED.sheets.forEach(s=>{SHEET_NAMES[s.id]=s.name});

let state=loadState();
let currentFilter='all';

function loadState(){
  try{
    const s=localStorage.getItem(STORAGE_KEY);
    if(s){const p=JSON.parse(s);if(p.contents&&p.contents.length===SEED.contents.length)return p}
  }catch(e){}
  return JSON.parse(JSON.stringify(SEED));
}
function save(){localStorage.setItem(STORAGE_KEY,JSON.stringify(state))}
function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),1500)}

function getTitle(obj){
  for(const k of['テーマ','投稿テーマ','リールテーマ','記事タイトル案','フレーム名','施策名','ネタ','フォーマット名','フックパターン']){
    if(obj[k])return obj[k];
  }
  return obj[Object.keys(obj)[1]]||obj[Object.keys(obj)[0]]||'(無題)';
}

function esc(s){return s?String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'):''}

function getVisibleFields(data){
  return Object.entries(data).filter(([k])=>{
    if(SKIP_FIELDS.has(k))return false;
    if(k==='カテゴリ'||k==='ターゲット')return false;
    const isTitle=['テーマ','投稿テーマ','リールテーマ','記事タイトル案','フレーム名','施策名','ネタ','フォーマット名','フックパターン'].includes(k);
    if(isTitle)return false;
    return true;
  }).filter(([k,v])=>v&&String(v).trim());
}

function renderFilters(){
  const counts={all:0,draft:0,approved:0,revision:0};
  state.contents.forEach(c=>{counts.all++;counts[c.status]=(counts[c.status]||0)+1});
  const f=document.getElementById('filters');
  f.innerHTML=[
    {key:'all',label:'すべて',c:counts.all},
    {key:'draft',label:'未チェック',c:counts.draft},
    {key:'approved',label:'投稿OK',c:counts.approved},
    {key:'revision',label:'ボツ',c:counts.revision},
  ].map(x=>`<button class="filter-btn${currentFilter===x.key?' active':''}" onclick="filterBy('${x.key}')">${x.label}<span class="count">${x.c}</span></button>`).join('');

  const pct=counts.all?Math.round(counts.approved/counts.all*100):0;
  document.getElementById('progFill').style.width=pct+'%';
  document.getElementById('progText').textContent=`${counts.approved}/${counts.all} 投稿OK (${pct}%)`;
}

function filterBy(s){currentFilter=s;renderFilters();renderFeed()}

function renderFeed(){
  let items=state.contents;
  if(currentFilter!=='all')items=items.filter(c=>c.status===currentFilter);
  const feed=document.getElementById('feed');
  if(!items.length){feed.innerHTML='<div class="empty"><div class="empty-icon">✨</div>コンテンツがありません</div>';return}
  feed.innerHTML=items.map(renderCard).join('');
}

function renderCard(item){
  const data=JSON.parse(item.col_data);
  const title=getTitle(data);
  const cat=SHEET_NAMES[item.sheet_id]||'';
  const fields=getVisibleFields(data);
  const isOK=item.status==='approved';
  const isNope=item.status==='revision';

  const bodyHtml=fields.map(([k,v])=>`<span class="label">${esc(k)}</span>${esc(v)}`).join('');

  const editFields=Object.entries(data).filter(([k])=>!SKIP_FIELDS.has(k)).filter(([k,v])=>v&&String(v).trim());
  const editHtml=editFields.map(([k,v])=>`<textarea class="edit-ta" data-key="${esc(k)}" placeholder="${esc(k)}">${esc(v)}</textarea>`).join('');

  return `<div class="card" id="card-${item.id}">
    <div class="card-meta">
      <div class="avatar">${cat.charAt(0)||'S'}</div>
      <div class="meta-text">
        <div class="meta-name">${esc(title)}</div>
        <div class="meta-cat">${esc(cat)}</div>
      </div>
      <div class="status-dot ${item.status}"></div>
    </div>
    <div class="card-body">
      <div class="card-text">${bodyHtml}</div>
      <div class="edit-area">${editHtml}
        <div class="edit-btns">
          <button class="btn-cancel" onclick="cancelEdit(${item.id})">キャンセル</button>
          <button class="btn-save" onclick="saveEdit(${item.id})">保存</button>
        </div>
      </div>
    </div>
    <div class="card-memo">
      <button class="memo-toggle" onclick="toggleMemo(${item.id})">💬 ${item.memo?'メモあり':'メモ'}</button>
      <div class="memo-box" id="memo-${item.id}">
        <textarea class="memo-input" placeholder="修正指示やメモ..." onchange="saveMemo(${item.id},this.value)">${esc(item.memo||'')}</textarea>
      </div>
    </div>
    <div class="card-actions">
      <button class="action-btn" onclick="toggleEdit(${item.id})" title="編集">
        <svg viewBox="0 0 24 24"><path d="M3 17.25V21h3.75L17.81 9.94l-3.75-3.75L3 17.25zM20.71 7.04c.39-.39.39-1.02 0-1.41l-2.34-2.34c-.39-.39-1.02-.39-1.41 0l-1.83 1.83 3.75 3.75 1.83-1.83z"/></svg>
      </button>
      <button class="action-btn nope${isNope?' active':''}" onclick="toggleStatus(${item.id},'revision')" title="ボツ">
        <svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm5 13.59L15.59 17 12 13.41 8.41 17 7 15.59 10.59 12 7 8.41 8.41 7 12 10.59 15.59 7 17 8.41 13.41 12 17 15.59z"/></svg>
        ${isNope?'ボツ':''}
      </button>
      <button class="action-btn like${isOK?' active':''}" onclick="toggleStatus(${item.id},'approved')" title="投稿OK">
        <svg viewBox="0 0 24 24"><path d="${isOK?'M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z':'M16.5 3c-1.74 0-3.41.81-4.5 2.09C10.91 3.81 9.24 3 7.5 3 4.42 3 2 5.42 2 8.5c0 3.78 3.4 6.86 8.55 11.54L12 21.35l1.45-1.32C18.6 15.36 22 12.28 22 8.5 22 5.42 19.58 3 16.5 3zm-4.4 15.55l-.1.1-.1-.1C7.14 14.24 4 11.39 4 8.5 4 6.5 5.5 5 7.5 5c1.54 0 3.04.99 3.57 2.36h1.87C13.46 5.99 14.96 5 16.5 5c2 0 3.5 1.5 3.5 3.5 0 2.89-3.14 5.74-7.9 10.05z'}"/></svg>
        ${isOK?'OK':''}
      </button>
    </div>
  </div>`;
}

function toggleStatus(id,target){
  const item=state.contents.find(c=>c.id===id);
  if(!item)return;
  item.status=item.status===target?'draft':target;
  save();
  toast(item.status==='approved'?'💚 投稿OK！':item.status==='revision'?'💗 ボツ':'戻しました');
  renderFilters();renderFeed();
}

function toggleEdit(id){document.getElementById('card-'+id).classList.toggle('editing')}
function cancelEdit(id){document.getElementById('card-'+id).classList.remove('editing')}
function saveEdit(id){
  const card=document.getElementById('card-'+id);
  const tas=card.querySelectorAll('.edit-ta');
  const item=state.contents.find(c=>c.id===id);
  if(!item)return;
  const data=JSON.parse(item.col_data);
  tas.forEach(ta=>{if(ta.dataset.key)data[ta.dataset.key]=ta.value});
  item.col_data=JSON.stringify(data);
  save();card.classList.remove('editing');
  toast('保存しました');renderFeed();
}
function toggleMemo(id){document.getElementById('memo-'+id).classList.toggle('open')}
function saveMemo(id,v){
  const item=state.contents.find(c=>c.id===id);
  if(item){item.memo=v;save();toast('メモ保存')}
}

renderFilters();renderFeed();
</script>
</body>
</html>
